<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123879"><title>HY STORE | Order Verification</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#172b4d;font:14px/1.5 Inter,Arial,sans-serif;padding:18px}.wrap{max-width:850px;margin:20px auto;background:#fff;border:1px solid #e1e8f2;border-radius:18px;overflow:hidden;box-shadow:0 12px 36px #102d6714}.head{padding:24px;background:linear-gradient(120deg,#102d67,#174caa);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:950;letter-spacing:1px}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#d9e5ff}.headtag{text-align:right;font-weight:800;font-size:12px}.body{padding:22px}.status{padding:13px 15px;border-radius:10px;font-weight:900;margin-bottom:15px}.status.ok{background:#e9f8f0;color:#14744f}.status.pending{background:#fff6e8;color:#95600b}.status.bad{background:#fff0f1;color:#b52e3b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.box{background:#f7f9fd;border:1px solid #e5ebf4;border-radius:10px;padding:11px;min-width:0}.box small{display:block;font-size:9px;color:#7887a0;font-weight:900;letter-spacing:.7px;text-transform:uppercase}.box b{display:block;margin-top:4px;overflow-wrap:anywhere}.section-title{margin:22px 0 8px;font-size:13px;font-weight:900;color:#173d83}.items{width:100%;border-collapse:collapse}.items th{background:#173d83;color:white;text-align:left;padding:10px;font-size:11px}.items td{padding:10px;border-bottom:1px solid #e9edf4;font-size:12px}.totals{max-width:330px;margin:16px 0 0 auto;display:grid;gap:7px}.totals div{display:flex;justify-content:space-between;gap:12px}.totals .grand{border-top:2px solid #173d83;padding-top:9px;font-size:17px;font-weight:950;color:#173d83}.codes{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:22px;padding-top:15px;border-top:1px dashed #ccd6e5}.barcode{flex:1;text-align:center;min-width:0}.barcode svg{width:100%;max-width:330px;height:70px}.barcode small,.qr small{display:block;color:#77859c;font-size:9px}.qr{text-align:center;min-width:110px}.qr canvas{width:96px!important;height:96px!important}.foot{text-align:center;color:#8793a7;font-size:10px;border-top:1px solid #e8edf4;padding:14px;margin-top:20px}.loading{text-align:center;padding:50px;color:#71819e}@media(max-width:560px){body{padding:7px}.wrap{margin:7px auto;border-radius:12px}.head{padding:17px}.brand{font-size:21px}.body{padding:13px}.grid{grid-template-columns:1fr}.items th,.items td{padding:7px 5px;font-size:10px}.codes{gap:8px}.qr{min-width:85px}.qr canvas{width:78px!important;height:78px!important}.barcode svg{height:52px}.totals{max-width:none}}@media print{body{padding:0;background:#fff}.wrap{margin:0;border:0;box-shadow:none;max-width:none}.head{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script></head>
<body><main class="wrap"><header class="head"><div class="brand">HY STORE<small>PERSONALIZED GIFTS & CUSTOM PRINTING</small></div><div class="headtag">ORDER<br>VERIFICATION</div></header><section class="body" id="content"><div class="loading">Loading secure HY STORE order details…</div></section></main>
<script>
const API='https://script.google.com/macros/s/AKfycbxDmDvjqGJRUWoLrWlY6M0T7XTW9N3nfSdEnE2Dycm8B7Jg_qdLjtj0YR0ca2Ghjs2a/exec';
const code=new URLSearchParams(location.search).get('code')||'';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'Rs '+Number(v||0).toLocaleString('en-PK',{maximumFractionDigits:2});
function load(){if(!code){document.getElementById('content').innerHTML='<div class="status bad">Order reference is missing.</div>';return;}const cb='hyStorePublicCallback';window[cb]=data=>{if(!data||!data.valid){document.getElementById('content').innerHTML='<div class="status bad">Order not found. Please contact HY STORE support.</div>';return;}render(data);};const sc=document.createElement('script');sc.src=API+'?action=publicOrderJsonp&code='+encodeURIComponent(code)+'&callback='+cb;sc.onerror=()=>document.getElementById('content').innerHTML='<div class="status bad">Could not load order details. Please try again later.</div>';document.body.appendChild(sc);}
function render(d){const paid=Number(d.paidAmount||0),balance=Number(d.balance||Math.max(0,Number(d.total||0)-paid));const paidState=/paid|verified|success|approved|complete/i.test(d.paymentStatus||'')||balance<=0;const items=(d.items||[]).map((it,i)=>{const qty=Number(it.qty||it.quantity||1),rate=Number(it.price||it.unitPrice||0),sub=Number(it.subtotal??qty*rate);return `<tr><td>${i+1}</td><td><b>${esc(it.name||it.title||it.productName||'Product')}</b></td><td>${qty}</td><td>${money(rate)}</td><td>${money(sub)}</td></tr>`}).join('')||'<tr><td colspan="5">No product details recorded.</td></tr>';
document.getElementById('content').innerHTML=`<div class="status ${paidState?'ok':'pending'}">${paidState?'✓ PAYMENT VERIFIED / PAID':'PAYMENT STATUS: '+esc(d.paymentStatus||'Pending')}</div><div class="grid"><div class="box"><small>Order Number</small><b>${esc(d.orderId)}</b></div><div class="box"><small>Invoice Number</small><b>${esc(d.invoiceId||'—')}</b></div><div class="box"><small>Order Date</small><b>${esc(d.date||'—')}</b></div><div class="box"><small>Order Status</small><b>${esc(d.orderStatus||'Recorded')}</b></div><div class="box"><small>Customer</small><b>${esc(d.customer||'—')}</b></div><div class="box"><small>Phone</small><b>${esc(d.phone||'—')}</b></div><div class="box"><small>Payment Method</small><b>${esc(d.paymentMethod||'—')}</b></div><div class="box"><small>Transaction Reference</small><b>${esc(d.transaction||'—')}</b></div><div class="box" style="grid-column:1/-1"><small>Delivery Address</small><b>${esc(d.address||'Not provided')}</b></div></div><div class="section-title">ORDER ITEMS</div><table class="items"><thead><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>Subtotal</th></tr></thead><tbody>${items}</tbody></table><div class="totals"><div><span>Grand Total</span><b>${money(d.total)}</b></div><div><span>Paid Amount</span><b>${money(paid)}</b></div><div class="grand"><span>Balance Due</span><span>${money(balance)}</span></div></div><div class="codes"><div class="barcode"><svg id="orderBarcode"></svg><small>ORDER BARCODE · ${esc(d.orderId)}</small></div><div class="qr"><div id="verifyQr"></div><small>HY STORE OFFICIAL RECORD</small></div></div><div class="foot">This page displays the latest order and payment information recorded by HY STORE. For any correction, contact store support.</div>`;
if(window.JsBarcode){try{JsBarcode('#orderBarcode',String(d.orderId).replace(/[^A-Za-z0-9-]/g,'').slice(0,40),{format:'CODE128',width:1.55,height:45,displayValue:true,fontSize:10,margin:2});}catch(e){}}if(window.QRCode)new QRCode(document.getElementById('verifyQr'),{text:location.href,width:100,height:100});}
load();
</script></body></html>
