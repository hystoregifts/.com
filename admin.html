<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyStore ERP — Complete Web ERP &amp; Google Sheets Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brandRed: {
              50: '#FEF2F2',
              100: '#FEE2E2',
              200: '#FECACA',
              500: '#EF4444',
              600: '#DC2626',
              700: '#B91C1C',
              800: '#991B1B',
            },
            brandBlue: {
              50: '#EFF6FF',
              100: '#DBEAFE',
              200: '#BFDBFE',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
              800: '#1E40AF',
              900: '#1E3A8A',
            }
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04)',
            'card-hover': '0 14px 30px -4px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.06)',
            'popover': '0 10px 25px -5px rgba(15, 23, 42, 0.18), 0 8px 10px -6px rgba(15, 23, 42, 0.10)',
            'nav': '0 -4px 20px -2px rgba(15, 23, 42, 0.08)'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F4F7FB;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }

    @keyframes fadeScaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(5px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .animate-modal {
      animation: fadeScaleIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media print {
      body {
        background: #FFFFFF !important;
      }
      body * {
        visibility: hidden;
      }
      #invoice-print-sheet, #invoice-print-sheet * {
        visibility: visible;
      }
      #invoice-print-sheet {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 20px !important;
        border: none !important;
        box-shadow: none !important;
        background: #FFFFFF !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="antialiased selection:bg-brandBlue-100 selection:text-brandBlue-900">

  <!-- ==================== TOAST NOTIFICATION CONTAINER ==================== -->
  <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0 no-print"></div>

  <!-- ==================== 1. LOGIN SCREEN ==================== -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-blue-50/50 to-red-50/50">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-card border border-slate-200/80 overflow-hidden animate-modal">
      <div class="h-2 w-full bg-gradient-to-r from-brandRed-600 via-brandBlue-700 to-brandBlue-900"></div>

      <div class="p-7 sm:p-9">
        <div class="flex flex-col items-center text-center mb-6">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brandRed-600 to-brandBlue-800 flex items-center justify-center text-white font-black text-xl tracking-tight shadow-md mb-3.5">
            HY
          </div>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-brandBlue-50 text-brandBlue-700 border border-brandBlue-100 mb-2">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            HYSTORE WEB ERP PORTAL
          </span>
          <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">HyStore Admin</h1>
          <p class="text-sm text-slate-500 mt-1">Web ERP Dashboard, Live Sheets Sync &amp; Invoice Studio</p>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label for="login-user" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Admin ID / Email</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input id="login-user" type="text" value="admin@hystore.pk" required
                class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brandBlue-600 focus:bg-white transition" />
            </div>
          </div>

          <div>
            <label for="login-pass" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Security PIN</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input id="login-pass" type="password" value="1234" required
                class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brandBlue-600 focus:bg-white transition" />
            </div>
          </div>

          <div>
            <label for="login-admin-key" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">ERP Admin API Key (from Code.gs)</label>
            <input id="login-admin-key" type="password" placeholder="Paste ERP_ADMIN_KEY from Code.gs" required class="w-full px-3.5 py-2 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl" />
          </div>
          <div>
            <label for="login-gas-url" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Google Apps Script URL (Optional — Auto-Saved)</label>
            <input id="login-gas-url" type="url" placeholder="https://script.google.com/macros/s/.../exec"
              class="w-full px-3.5 py-2 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brandBlue-600 focus:bg-white transition" />
          </div>

          <div id="login-error" class="hidden text-xs font-medium text-brandRed-600 bg-brandRed-50 border border-brandRed-200 rounded-lg px-3 py-2">
            Invalid credentials. Use demo PIN 1234.
          </div>

          <button type="submit"
            class="w-full py-3 px-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-brandBlue-700 to-brandBlue-800 hover:from-brandBlue-800 hover:to-brandBlue-900 shadow-sm transition flex items-center justify-center gap-2">
            <span>Sign In &amp; Open Web ERP</span>
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>

          <button type="button" id="one-click-demo-btn"
            class="w-full py-2.5 px-4 rounded-xl text-sm font-bold text-brandRed-600 bg-brandRed-50 hover:bg-brandRed-100 border border-brandRed-200 transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span>One-Click Demo Login</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== 2. MAIN ERP APPLICATION SHELL ==================== -->
  <div id="erp-app" class="hidden min-h-screen flex flex-col lg:flex-row">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200/90 flex flex-col transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200 ease-out no-print">
      <div class="h-16 px-5 flex items-center justify-between border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brandRed-600 to-brandBlue-800 flex items-center justify-center text-white font-black text-sm tracking-tight shadow-sm">
            HY
          </div>
          <div>
            <div class="font-extrabold text-slate-900 text-base leading-tight">HyStore <span class="text-brandRed-600">ERP</span></div>
            <div id="sidebar-sync-label" class="text-[11px] font-medium text-slate-400">Web ERP System</div>
          </div>
        </div>
        <button id="close-sidebar-btn" class="lg:hidden p-2 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Navigation Links -->
      <div class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
        <div class="px-3 pb-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400">Web ERP Modules</div>

        <button data-nav="dashboard" class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
            <span>ERP Dashboard</span>
          </span>
        </button>

        <button data-nav="orders" class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span>Orders</span>
          </span>
          <span id="sidebar-unread-badge" class="px-2 py-0.5 text-xs font-bold rounded-full bg-brandRed-600 text-white">4</span>
        </button>

        <button data-nav="invoices" class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>Invoice Studio (PDF)</span>
          </span>
        </button>

        <button data-nav="products" class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
            <span>Products</span>
          </span>
          <span id="sidebar-products-count" class="text-xs font-semibold text-slate-400">4</span>
        </button>

        <button data-nav="categories" class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span>Shop Collections</span>
          </span>
        </button>

        <button data-nav="media" class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            <span>Connected Site &amp; Video</span>
          </span>
        </button>

        <div class="pt-4 pb-1.5 px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400">Google Sheet API</div>

        <button data-nav="settings" class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition">
          <span class="flex items-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Sheet Config &amp; Script</span>
          </span>
          <span id="sidebar-lock-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
        </button>
      </div>

      <!-- Bottom Status & Logout -->
      <div class="p-4 border-t border-slate-100 space-y-2.5">
        <div id="sidebar-conn-card" class="p-3 rounded-xl bg-slate-50 border border-slate-200/80 text-[11px]"></div>
        <button id="logout-btn" class="w-full py-2 px-3 rounded-xl text-xs font-semibold text-slate-600 hover:text-brandRed-600 hover:bg-brandRed-50 border border-slate-200 transition flex items-center justify-center gap-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Lock Admin</span>
        </button>
      </div>
    </aside>

    <!-- Mobile Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-30 hidden lg:hidden no-print"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 pb-20 lg:pb-8">

      <!-- Top Header -->
      <header class="sticky top-0 z-20 h-16 bg-white/95 backdrop-blur-md border-b border-slate-200/80 px-4 sm:px-6 flex items-center justify-between gap-3 no-print">
        <div class="flex items-center gap-3 min-w-0">
          <button id="open-sidebar-btn" class="lg:hidden p-2 rounded-xl text-slate-600 hover:bg-slate-100 shrink-0">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="truncate">
            <h2 id="page-title" class="text-base sm:text-lg font-extrabold text-slate-900 tracking-tight truncate">Web ERP Dashboard</h2>
            <p id="page-subtitle" class="text-xs text-slate-500 hidden sm:block truncate">Live financial summary, orders, products, collections &amp; sheet sync</p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button id="sync-now-btn" class="px-3 py-2 rounded-xl text-xs font-bold bg-brandBlue-50 text-brandBlue-700 hover:bg-brandBlue-100 border border-brandBlue-200 transition flex items-center gap-1.5">
            <svg id="sync-spinner-icon" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span class="hidden sm:inline">Fetch Sheet Data</span>
          </button>

          <button id="simulate-order-btn" class="px-3 py-2 rounded-xl text-xs font-bold bg-brandRed-600 text-white hover:bg-brandRed-700 shadow-xs transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>+ New Order</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <main id="main-content" class="flex-1 p-4 sm:p-6 max-w-[1440px] w-full mx-auto space-y-5">
        <!-- Rendered by JS -->
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 shadow-nav grid grid-cols-6 h-16 px-1 no-print">
      <button data-nav="dashboard" class="mobile-nav-item flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-slate-500">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>ERP</span>
      </button>
      <button data-nav="orders" class="mobile-nav-item relative flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-slate-500">
        <span id="mobile-unread-badge" class="absolute top-1.5 right-2.5 w-4 h-4 rounded-full bg-brandRed-600 text-white text-[9px] font-bold flex items-center justify-center">4</span>
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Orders</span>
      </button>
      <button data-nav="invoices" class="mobile-nav-item flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-slate-500">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Invoice</span>
      </button>
      <button data-nav="products" class="mobile-nav-item flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-slate-500">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
        <span>Products</span>
      </button>
      <button data-nav="categories" class="mobile-nav-item flex flex-col items-center justify-center gap-1 text-[10px] font-medium text-slate-500">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>Collections</span>

    // -------------------- IMAGE COMPRESSOR FOR DIRECT PHOTO UPLOAD --------------------
    function compressImageToDataUrl(file, maxWidth = 720, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // -------------------- FLEXIBLE ROW NORMALIZER FOR GOOGLE SHEETS --------------------
    function pickField(row, keys, fallback = '') {
      if (!row || typeof row !== 'object') return fallback;
      const rowKeys = Object.keys(row);
      for (const target of keys) {
        const normTarget = target.toLowerCase().replace(/[\s_-]+/g, '');
        const foundKey = rowKeys.find(k => k.toLowerCase().replace(/[\s_-]+/g, '') === normTarget);
        if (foundKey !== undefined && row[foundKey] !== '' && row[foundKey] !== null && row[foundKey] !== undefined) {
          return row[foundKey];
        }
      }
      return fallback;
    }

    function normalizeSheetOrders(rows) {
      if (!Array.isArray(rows)) return [];
      return rows.map((r, idx) => {
        const total = Number(pickField(r, ['Total_Amount', 'Total', 'Amount', 'GrandTotal', 'Price'], 0)) || 0;
        const paid = Number(pickField(r, ['Paid_Amount', 'Paid', 'Advance', 'AmountPaid'], 0)) || 0;
        const qty = Number(pickField(r, ['Qty', 'Quantity', 'ItemsCount'], 1)) || 1;
        const prodName = String(pickField(r, ['Product_Name', 'Product', 'Item', 'Title'], 'Ordered Item'));
        const unitPrice = qty > 0 ? Math.round(total / qty) : total;
        const rawItems = pickField(r, ['Items', 'LineItems'], null);
        let parsedItems = [{ name: prodName, qty, price: unitPrice }];
        if (Array.isArray(rawItems) && rawItems.length) {
          parsedItems = rawItems;
        } else if (typeof rawItems === 'string' && rawItems.trim().startsWith('[')) {
          try { parsedItems = JSON.parse(rawItems); } catch (_) {}
        }

        return {
          Order_ID: String(pickField(r, ['Order_ID', 'ID', 'OrderId'], `HS-${8800 + idx}`)),
          Order_Number: String(pickField(r, ['Order_Number', 'OrderNo', 'OrderNum', 'Number'], `ORD-${9000 + idx}`)),
          Customer_Name: String(pickField(r, ['Customer_Name', 'Customer', 'Name', 'FullName'], 'Customer')),
          Phone: String(pickField(r, ['Phone', 'Mobile', 'Contact', 'WhatsApp'], '')),
          Address: String(pickField(r, ['Address', 'ShippingAddress', 'City', 'Location'], '')),
          Product_Name: prodName,
          Product_Link: String(pickField(r, ['Product_Link', 'Link', 'ProductURL', 'URL'], '')),
          Product_Image: String(pickField(r, ['Product_Image', 'Image', 'Photo', 'Picture', 'ImageURL'], '')),
          Qty: qty,
          Shipping: Number(pickField(r, ['Shipping', 'Delivery', 'ShippingFee'], 0)) || 0,
          Discount: Number(pickField(r, ['Discount', 'Off'], 0)) || 0,
          Paid_Amount: paid,
          Total_Amount: total,
          Payment_Method: String(pickField(r, ['Payment_Method', 'Payment', 'Method'], 'COD')),
          Payment_Slip: String(pickField(r, ['Payment_Slip', 'Slip', 'Receipt', 'Screenshot'], '')),
          Status: String(pickField(r, ['Status', 'OrderStatus'], 'Placed')),
          Date: String(pickField(r, ['Date', 'Created', 'Timestamp'], 'Today')),
          Items: parsedItems,
          unread: Boolean(pickField(r, ['unread'], false))
        };
      });

    // -------------------- CORS-SAFE GOOGLE APPS SCRIPT FETCH & PUSH --------------------
    function appendSyncLog(status, msg) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      state.syncLogs.unshift({ time, status, msg });
      if (state.syncLogs.length > 8) state.syncLogs.pop();
    }

    async function fetchFromGoogleSheet(silent = false) {
      const url = (state.gasUrl || '').trim();
      if (!url) {
        if (!silent) showToast('No Apps Script URL', 'Paste your Web App URL in Sheet Config first.', 'red');
        return false;
      }

      const spinner = document.getElementById('sync-spinner-icon');
      if (spinner) spinner.classList.add('animate-spin');

      try {
        // Use clean GET with query param and NO custom headers so browser skips CORS OPTIONS preflight!
        const sep = url.includes('?') ? '&' : '?';
        const fetchUrl = `${url}${sep}action=getAll&key=${encodeURIComponent(state.adminKey)}&_t=${Date.now()}`;

        const response = await fetch(fetchUrl, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} from Apps Script`);
        }

        const text = await response.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Response was not valid JSON. Ensure Web App access is set to "Anyone".');
        }

        if (json.error) {
          throw new Error(json.error);
        }

        // Extract arrays flexibly whether root is an array or object with tab keys
        const rawOrders = json.orders || json.Orders || (Array.isArray(json) ? json : null);
        const rawProducts = json.products || json.Products || null;
        const rawCollections = json.collections || json.Collections || json.categories || json.Categories || null;
        const rawMedia = json.media || json.Media || json.siteMedia || json.SiteMedia || null;

        let loadedSummary = [];
        if (Array.isArray(rawOrders)) {
          state.data.orders = normalizeSheetOrders(rawOrders);
          if (state.data.orders.length > 0) {
            state.selectedInvoiceOrderId = state.data.orders[0].Order_ID;
          }
          loadedSummary.push(`${state.data.orders.length} Orders`);
        }
        if (Array.isArray(rawProducts)) {
          state.data.products = normalizeSheetProducts(rawProducts);
          loadedSummary.push(`${state.data.products.length} Products`);
        }
        if (Array.isArray(rawCollections)) {
          state.data.categories = normalizeSheetCollections(rawCollections);
          loadedSummary.push(`${state.data.categories.length} Collections`);
        }
        if (Array.isArray(rawMedia)) {
          state.data.siteMedia = normalizeSheetMedia(rawMedia);
          loadedSummary.push(`${state.data.siteMedia.length} Media`);
        }

        const summaryText = loadedSummary.length ? loadedSummary.join(', ') : 'Connected (0 rows returned)';
        appendSyncLog('success', `Fetched live data: ${summaryText}`);
        renderAll();
        if (!silent) showToast('Google Sheet Synced', `Loaded ${summaryText}`);
        return true;
      } catch (err) {
        appendSyncLog('error', `Fetch failed: ${err.message}`);
        renderAll();
        if (!silent) showToast('Sheet Fetch Error', err.message, 'red');
        return false;
      } finally {
        if (spinner) spinner.classList.remove('animate-spin');
      }
    }

    async function pushToGoogleSheet(action, payload) {
      const url = (state.gasUrl || '').trim();
      if (!url) return;

      try {
        // Use text/plain so Google Apps Script receives POST body without triggering CORS preflight
        const res = await fetch(url, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, payload, key: state.adminKey })
        });
        const text = await res.text();
        appendSyncLog('success', `Pushed "${action}" to Google Sheet.`);
        return text;
      } catch (err) {
        appendSyncLog('error', `Push "${action}" warning: ${err.message}`);
      }
    }

    // -------------------- PRODUCT LINK -> IMAGE RESOLVER --------------------
    function resolveOrderProductImage(order) {
      if (order.Product_Image && order.Product_Image.trim() !== '') {
        return order.Product_Image.trim();
      }
      if (order.Product_Link && order.Product_Link.trim() !== '') {
        const cleanLink = order.Product_Link.trim().toLowerCase().replace(/\/$/, '');
        const matchedByLink = state.data.products.find(p =>
          p.Product_Link && p.Product_Link.trim().toLowerCase().replace(/\/$/, '') === cleanLink
        );
        if (matchedByLink && matchedByLink.Product_Image) {
          return matchedByLink.Product_Image;
        }
      }
      if (order.Product_Name) {
        const matchedByName = state.data.products.find(p =>
          p.Product_Name.toLowerCase() === order.Product_Name.trim().toLowerCase()
        );
        if (matchedByName && matchedByName.Product_Image) {
          return matchedByName.Product_Image;
        }
      }
      return '';
    }

    // -------------------- FINANCIAL & ORDER HELPERS --------------------
    function formatCurrency(val) {
      return `Rs. ${Number(val || 0).toLocaleString()}`;

    function calculateOrderFinancials(order) {
      const items = Array.isArray(order.Items) && order.Items.length
        ? order.Items
        : [{ name: order.Product_Name || 'Product', qty: Number(order.Qty) || 1, price: Number(order.Total_Amount) || 0 }];

      const itemsSubtotal = items.reduce((sum, it) => sum + ((Number(it.qty) || 0) * (Number(it.price) || 0)), 0);
      const totalItemsCount = items.reduce((sum, it) => sum + (Number(it.qty) || 0), 0);
      const shipping = Number(order.Shipping) || 0;
      const discount = Number(order.Discount) || 0;
      const grandTotal = Math.max(0, itemsSubtotal + shipping - discount);
      const paidAmount = Number(order.Paid_Amount) || 0;
      const remainingBalance = Math.max(0, grandTotal - paidAmount);

      return { items, itemsSubtotal, totalItemsCount, shipping, discount, grandTotal, paidAmount, remainingBalance };
    }

          <button onclick="setActiveTab('invoices')" class="p-4 rounded-2xl bg-white hover:bg-brandBlue-50/60 border border-slate-200/80 shadow-card text-left transition flex items-center gap-3">

            <div>
              <div class="text-xs font-extrabold text-slate-900">Invoice Studio</div>
              <div class="text-[11px] text-slate-500">Edit &amp; Download PDF</div>
            </div>
          </button>

          <button onclick="setActiveTab('products')" class="p-4 rounded-2xl bg-white hover:bg-brandBlue-50/60 border border-slate-200/80 shadow-card text-left transition flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shrink-0">${Icons.products}</div>
            <div>
              <div class="text-xs font-extrabold text-slate-900">Products &amp; Photos</div>
              <div class="text-[11px] text-slate-500">Upload &amp; sync links</div>
            </div>
          </button>

          <button onclick="setActiveTab('settings')" class="p-4 rounded-2xl bg-white hover:bg-brandBlue-50/60 border border-slate-200/80 shadow-card text-left transition flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0">${Icons.sheet}</div>
            <div>
              <div class="text-xs font-extrabold text-slate-900">Google Sheet API</div>
              <div class="text-[11px] text-slate-500">${state.gasUrl ? 'Connected & Locked' : 'Connect URL'}</div>
            </div>
          </button>
        </div>

        <!-- Middle Grid: Order Fulfillment Breakdown + Recent Orders -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <!-- Fulfillment Pipeline Breakdown -->
          <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-200/70 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-slate-900">Order Fulfillment Pipeline</h3>
              <span class="text-xs font-bold text-slate-400">${totalOrders} Total</span>
            </div>

            <div class="space-y-3.5 pt-1">
              ${STATUS_OPTIONS.map(st => {
                const count = state.data.orders.filter(o => o.Status === st).length;
                const pct = totalOrders > 0 ? Math.round((count / totalOrders) * 100) : 0;
                const style = getStatusStyle(st);
                return `
                  <div>
                    <div class="flex items-center justify-between text-xs font-bold mb-1">
                      <span class="flex items-center gap-2 text-slate-700">
                        <span class="w-2 h-2 rounded-full ${style.dot}"></span>
                        <span>${st}</span>
                      </span>
                      <span class="text-slate-900">${count} (${pct}%)</span>
                    </div>
                    <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                      <div class="h-full rounded-full ${style.bar} transition-all duration-300" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="pt-3 border-t border-slate-100">
              <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Recent Sheet Sync Log</div>
              <div class="space-y-1.5 max-h-28 overflow-y-auto text-[11px]">
                ${state.syncLogs.slice(0, 3).map(log => `
                  <div class="p-2 rounded-lg bg-slate-50 border border-slate-100 flex items-start justify-between gap-2">
                    <span class="${log.status === 'error' ? 'text-brandRed-600 font-semibold' : 'text-slate-600'}">${log.msg}</span>
                    <span class="text-slate-400 shrink-0">${log.time}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Recent Orders Table with Direct Invoice & Edit Jumps -->
          <div class="lg:col-span-2 bg-white rounded-2xl p-5 shadow-card border border-slate-200/70 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-extrabold text-slate-900">Recent Customer Orders</h3>
                <button onclick="setActiveTab('orders')" class="text-xs font-bold text-brandBlue-700 hover:underline">View All Cards</button>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-50 text-slate-500 font-bold uppercase text-[10px]">
                    <tr>
                      <th class="py-2.5 px-3 rounded-l-lg">Order # / ID</th>
                      <th class="py-2.5 px-3">Customer</th>
                      <th class="py-2.5 px-3">Items</th>
                      <th class="py-2.5 px-3">Paid / Rem</th>
                      <th class="py-2.5 px-3">Status</th>
                      <th class="py-2.5 px-3 text-right rounded-r-lg">Invoice</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${state.data.orders.slice(0, 5).map(o => {
                      const fin = calculateOrderFinancials(o);
                      const st = getStatusStyle(o.Status);
                      return `
                        <tr class="hover:bg-slate-50/80 transition">
                          <td class="py-3 px-3">
                            <div class="font-extrabold text-slate-900">#${o.Order_Number}</div>
                            <div class="text-[10px] font-semibold text-brandBlue-700">${o.Order_ID}</div>
                          </td>
                          <td class="py-3 px-3">
                            <div class="font-bold text-slate-800">${o.Customer_Name}</div>
                            <div class="text-[11px] text-slate-400">${o.Product_Name}</div>
                          </td>
                          <td class="py-3 px-3 font-bold text-slate-700">${fin.totalItemsCount}</td>
                          <td class="py-3 px-3">
                            <div class="font-bold text-emerald-700">${formatCurrency(fin.paidAmount)}</div>
                            <div class="text-[10px] font-semibold ${fin.remainingBalance > 0 ? 'text-brandRed-600' : 'text-slate-400'}">Rem: ${formatCurrency(fin.remainingBalance)}</div>
                          </td>
                          <td class="py-3 px-3">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${st.badge}">${o.Status}</span>
                          </td>
                          <td class="py-3 px-3 text-right">
                            <button onclick="openInvoiceStudioForOrder('${o.Order_ID}')" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold bg-brandBlue-50 text-brandBlue-700 hover:bg-brandBlue-700 hover:text-white transition">
                              Edit / PDF

                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== PAGE 1: PORTRAIT ORDER CARDS ====================
    function renderOrdersPage() {
      const filters = ['All', ...STATUS_OPTIONS];
      const q = state.orderSearch.toLowerCase();
      const filtered = state.data.orders.filter(o => {
        const matchStatus = state.orderFilter === 'All' || o.Status === state.orderFilter;
        const matchText = !q ||
          o.Order_Number.toLowerCase().includes(q) ||
          o.Order_ID.toLowerCase().includes(q) ||
          o.Customer_Name.toLowerCase().includes(q) ||
          o.Product_Name.toLowerCase().includes(q) ||
          o.Phone.includes(q);
        return matchStatus && matchText;
      });

      return `
        <!-- Filter & Search Bar -->
        <div class="bg-white rounded-2xl p-3.5 sm:p-4 shadow-card border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0">
            ${filters.map(f => {
              const count = f === 'All' ? state.data.orders.length : state.data.orders.filter(o => o.Status === f).length;
              const active = state.orderFilter === f;
              return `
                <button onclick="state.orderFilter='${f}'; renderAll()"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${active ? 'bg-brandBlue-700 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'}">
                  <span>${f}</span>
                  <span class="px-1.5 py-0.2 rounded-full text-[10px] ${active ? 'bg-white/20 text-white' : 'bg-white text-slate-600'}">${count}</span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="relative w-full md:w-64">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">${Icons.search}</span>
            <input type="text" value="${state.orderSearch}" oninput="state.orderSearch=this.value; renderAll()"
              placeholder="Search Order #, ID, Name..."
              class="w-full pl-9 pr-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brandBlue-600 focus:bg-white" />
          </div>
        </div>

        <!-- Narrow / Tall Portrait Order Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
          ${filtered.map(order => {
            const productImg = resolveOrderProductImage(order);
            const stStyle = getStatusStyle(order.Status);
            const isDropdownOpen = state.openStatusDropdownId === order.Order_ID;
            const fin = calculateOrderFinancials(order);

            return `
              <div class="bg-white rounded-2xl shadow-card hover:shadow-card-hover border ${order.unread ? 'border-brandRed-300 ring-1 ring-brandRed-100' : 'border-slate-200/80'} flex flex-col justify-between transition relative">

                <!-- TOP: Large Order Number & Order ID -->
                <div class="p-4 pb-3 border-b border-slate-100 bg-gradient-to-r from-brandBlue-50/60 via-white to-brandRed-50/40 rounded-t-2xl">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Order Number</div>
                      <div class="text-xl font-black text-slate-900 tracking-tight leading-tight mt-0.5">#${order.Order_Number}</div>
                    </div>
                    <div class="text-right">
                      <span class="inline-block px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-brandBlue-900 text-white tracking-wide shadow-2xs">
                        ${order.Order_ID}
                      </span>
                      ${order.unread ? `<div class="mt-1"><span class="px-1.5 py-0.5 rounded text-[9px] font-extrabold bg-brandRed-600 text-white uppercase">New</span></div>` : ''}
                    </div>
                  </div>
                </div>

                <!-- CENTER: Product Picture Frame (Resolved from Product_Link) -->
                <div class="relative border-b border-slate-100">
                  ${renderMediaBox(productImg, order.Product_Name, 'h-48', 'Product Image Placeholder')}

                  <span class="absolute top-2.5 left-2.5 px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-slate-900/85 text-white backdrop-blur-xs">
                    Items: ${fin.totalItemsCount}
                  </span>

                  ${order.Product_Link ? `
                    <a href="${order.Product_Link}" target="_blank" rel="noopener noreferrer" title="Open Ordered Product Link"
                      class="absolute top-2.5 right-2.5 p-2 rounded-xl bg-white/95 text-brandBlue-700 hover:bg-brandBlue-700 hover:text-white shadow-sm border border-slate-200/70 transition">
                      ${Icons.externalLink}
                    </a>
                  ` : ''}
                </div>

                <!-- MIDDLE DETAILS: Product Name, Paid/Rem Summary, Customer & Address -->
                <div class="p-4 space-y-3 flex-1">
                  <div>
                    <div class="text-xs font-extrabold text-slate-900 line-clamp-1" title="${order.Product_Name}">${order.Product_Name}</div>
                    <div class="flex items-center justify-between mt-1">
                      <span class="text-base font-black text-brandBlue-800">${formatCurrency(fin.grandTotal)}</span>
                      <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${fin.remainingBalance > 0 ? 'bg-brandRed-50 text-brandRed-700 border border-brandRed-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">
                        ${fin.remainingBalance > 0 ? `Rem: ${formatCurrency(fin.remainingBalance)}` : 'Full Paid'}
                      </span>
                    </div>
                  </div>

                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 space-y-1.5 text-xs">
                    <div class="font-bold text-slate-800 truncate">${order.Customer_Name}</div>
                    <div class="flex items-center gap-1.5 text-slate-600">
                      <span class="text-brandBlue-600 shrink-0">${Icons.phone}</span>
                      <span class="truncate">${order.Phone}</span>
                    </div>
                    <div class="flex items-start gap-1.5 text-slate-500">
                      <span class="text-brandRed-600 shrink-0 mt-0.5">${Icons.mapPin}</span>
                      <span class="line-clamp-2 text-[11px] leading-snug">${order.Address}</span>
                    </div>
                  </div>
                </div>

                <!-- BOTTOM: Interactive Tap Status Dropdown + Icon Row -->
                <div class="px-4 py-3 bg-slate-50/90 border-t border-slate-100 rounded-b-2xl space-y-2.5">
                  <div class="relative status-dropdown-wrapper">
                    <button type="button" onclick="toggleStatusDropdown('${order.Order_ID}', event)"
                      class="w-full px-3 py-2 rounded-xl text-xs font-bold border ${stStyle.badge} flex items-center justify-between transition shadow-2xs hover:brightness-95">
                      <span class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full ${stStyle.dot}"></span>
                        <span>Status: ${order.Status}</span>
                      </span>
                      <span class="flex items-center gap-1 text-[11px] opacity-80">
                        <span>Change</span>
                        ${Icons.chevronDown}
                      </span>
                    </button>

                    ${isDropdownOpen ? `
                      <div class="absolute bottom-full left-0 right-0 mb-1.5 bg-white rounded-xl shadow-popover border border-slate-200 p-1.5 z-30 animate-modal">
                        <div class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">Select Order Status</div>
                        ${STATUS_OPTIONS.map(opt => {
                          const optStyle = getStatusStyle(opt);
                          const selected = order.Status === opt;
                          return `
                            <button type="button" onclick="selectOrderStatus('${order.Order_ID}', '${opt}', event)"
                              class="w-full px-2.5 py-2 rounded-lg text-xs font-semibold flex items-center justify-between transition ${selected ? 'bg-brandBlue-50 text-brandBlue-800 font-bold' : 'text-slate-700 hover:bg-slate-100'}">
                              <span class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full ${optStyle.dot}"></span>
                                <span>${opt}</span>
                              </span>
                              ${selected ? `<span class="text-brandBlue-700">${Icons.check}</span>` : ''}
                            </button>
                          `;
                        }).join('')}
                      </div>
                    ` : ''}
                  </div>

                  <div class="grid grid-cols-3 gap-1.5 pt-0.5">
                    <button onclick="openEditOrderModal('${order.Order_ID}')" title="Edit Order Card"
                      class="py-2 px-2 rounded-xl bg-white hover:bg-brandBlue-50 text-slate-700 hover:text-brandBlue-700 border border-slate-200/90 text-[11px] font-semibold flex items-center justify-center gap-1 transition">
                      ${Icons.edit} <span>Edit</span>
                    </button>
                    <button onclick="openSlipModal('${order.Order_ID}')" title="Payment Receipt"
                      class="py-2 px-2 rounded-xl bg-white hover:bg-brandBlue-50 text-slate-700 hover:text-brandBlue-700 border border-slate-200/90 text-[11px] font-semibold flex items-center justify-center gap-1 transition">
                      ${Icons.slip} <span>Slip</span>
                    </button>
                    <button onclick="openInvoiceStudioForOrder('${order.Order_ID}')" title="Open Editable Invoice & PDF"
                      class="py-2 px-2 rounded-xl bg-white hover:bg-brandRed-50 text-slate-700 hover:text-brandRed-600 border border-slate-200/90 text-[11px] font-semibold flex items-center justify-center gap-1 transition">
                      ${Icons.invoice} <span>Invoice</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function toggleStatusDropdown(orderId, event) {
      event.stopPropagation();
      state.openStatusDropdownId = state.openStatusDropdownId === orderId ? null : orderId;
      renderAll();
    }

    function selectOrderStatus(orderId, newStatus, event) {
      event.stopPropagation();
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order) return;
      order.Status = newStatus;
      order.unread = false;
      state.openStatusDropdownId = null;
      pushToGoogleSheet('updateStatus', { Order_ID: order.Order_ID, Order_Number: order.Order_Number, Status: newStatus });
      renderAll();
      showToast(`#${order.Order_Number} Updated`, `Status changed to ${newStatus}`);
    }

    function openEditOrderModal(orderId) {
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order) return;
      order.unread = false;
      updateShell();

      openModal(`
        <div class="px-6 py-4 bg-gradient-to-r from-brandBlue-800 to-brandBlue-900 text-white flex items-center justify-between">
          <div class="flex items-center gap-2">
            ${Icons.edit}
            <h3 class="font-bold text-base">Edit Order #${order.Order_Number} (${order.Order_ID})</h3>
          </div>
          <button onclick="closeModal()" class="p-1 rounded-lg hover:bg-white/15">${Icons.close}</button>
        </div>
        <form onsubmit="saveOrderModal(event, '${order.Order_ID}')" class="p-6 space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Order Number</label>
              <input id="eo-num" type="text" value="${order.Order_Number}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
              <select id="eo-status" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-white">
                ${STATUS_OPTIONS.map(s => `<option value="${s}" ${order.Status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Customer Name</label>
              <input id="eo-cust" type="text" value="${order.Customer_Name}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Phone</label>
              <input id="eo-phone" type="text" value="${order.Phone}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Address</label>
            <input id="eo-addr" type="text" value="${order.Address}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
            <div class="sm:col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Product Name</label>
              <input id="eo-prod" type="text" value="${order.Product_Name}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Qty</label>
              <input id="eo-qty" type="number" value="${order.Qty}" min="1" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Product Link (Auto-fetches product image)</label>
            <input id="eo-link" type="text" value="${order.Product_Link || ''}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Paid Amount (Rs.)</label>
              <input id="eo-paid" type="number" value="${order.Paid_Amount || 0}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Total Amount (Rs.)</label>
              <input id="eo-total" type="number" value="${order.Total_Amount}" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Payment Slip URL</label>
              <input id="eo-slip" type="text" value="${order.Payment_Slip || ''}" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl" />
            </div>
          </div>

          <div class="pt-3 flex items-center justify-between border-t border-slate-100">
            <button type="button" onclick="deleteOrderRow('${order.Order_ID}')" class="px-3 py-2 rounded-xl text-xs font-bold text-brandRed-600 hover:bg-brandRed-50 flex items-center gap-1.5">
              ${Icons.trash} <span>Delete Order</span>
            </button>
            <div class="flex gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
              <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-brandBlue-700 hover:bg-brandBlue-800">Save Card</button>
            </div>
          </div>
        </form>
      `);
    }

    function saveOrderModal(e, orderId) {
      e.preventDefault();
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order) return;
      order.Order_Number = document.getElementById('eo-num').value.trim();
      order.Status = document.getElementById('eo-status').value;
      order.Customer_Name = document.getElementById('eo-cust').value.trim();
      order.Phone = document.getElementById('eo-phone').value.trim();
      order.Address = document.getElementById('eo-addr').value.trim();
      order.Product_Name = document.getElementById('eo-prod').value.trim();
      order.Qty = Number(document.getElementById('eo-qty').value);
      order.Product_Link = document.getElementById('eo-link').value.trim();
      order.Paid_Amount = Number(document.getElementById('eo-paid').value);
      order.Total_Amount = Number(document.getElementById('eo-total').value);
      order.Payment_Slip = document.getElementById('eo-slip').value.trim();

      if (order.Items && order.Items.length === 1) {
        order.Items[0].name = order.Product_Name;
        order.Items[0].qty = order.Qty;
      }

      pushToGoogleSheet('updateOrder', order);
      closeModal();
      renderAll();
      showToast(`Order #${order.Order_Number} Saved`, 'Order details & balances updated.');
    }

    function deleteOrderRow(orderId) {
      state.data.orders = state.data.orders.filter(o => o.Order_ID !== orderId);
      pushToGoogleSheet('deleteOrder', { Order_ID: orderId });
      closeModal();
      renderAll();
      showToast('Order Deleted', `${orderId} removed.`, 'red');
    }

    function updateInvoiceField(orderId, field, value) {
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order) return;
      if (['Shipping', 'Discount', 'Paid_Amount'].includes(field)) {
        order[field] = Number(value) || 0;
      } else {
        order[field] = value;
      }
      const fin = calculateOrderFinancials(order);
      order.Total_Amount = fin.grandTotal;
      order.Qty = fin.totalItemsCount;
      renderAll();
    }

    function updateInvoiceLineItem(orderId, itemIndex, key, value) {
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order || !order.Items || !order.Items[itemIndex]) return;
      order.Items[itemIndex][key] = key === 'name' ? value : (Number(value) || 0);
      const fin = calculateOrderFinancials(order);
      order.Total_Amount = fin.grandTotal;
      order.Qty = fin.totalItemsCount;
      if (itemIndex === 0 && key === 'name') {
        order.Product_Name = value;
      }
      renderAll();
    }

    function addInvoiceLineItem(orderId) {
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order) return;
      if (!Array.isArray(order.Items)) order.Items = [];
      order.Items.push({ name: 'Additional HyStore Item', qty: 1, price: 1500 });
      const fin = calculateOrderFinancials(order);
      order.Total_Amount = fin.grandTotal;
      order.Qty = fin.totalItemsCount;
      renderAll();
    }

    function removeInvoiceLineItem(orderId, itemIndex) {
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order || !Array.isArray(order.Items) || order.Items.length <= 1) return;
      order.Items.splice(itemIndex, 1);
      const fin = calculateOrderFinancials(order);
      order.Total_Amount = fin.grandTotal;
      order.Qty = fin.totalItemsCount;
      renderAll();
    }

    function saveInvoiceEdits(orderId) {
      const order = state.data.orders.find(o => o.Order_ID === orderId);
      if (!order) return;
      pushToGoogleSheet('updateOrder', order);
      showToast(`Invoice #${order.Order_Number} Saved`, 'Paid & remaining balances synced.');
    }

    function downloadInvoicePDF() {
      showToast('Preparing PDF Document...', 'Select "Save as PDF" in the print dialog.');
      setTimeout(() => {
        window.print();
      }, 250);
    }

    async function handleProductCardPhotoUpload(event, prodId) {
      const file = event.target.files[0];
      if (!file) return;
      const prod = state.data.products.find(p => p.Product_ID === prodId);
      if (!prod) return;

      try {
        const compressedDataUrl = await compressImageToDataUrl(file);
        prod.Product_Image = compressedDataUrl;
        pushToGoogleSheet('updateProduct', prod);
        renderAll();
        showToast('Product Photo Uploaded', `${prod.Product_Name} image updated & synced.`);
      } catch (err) {
        showToast('Upload Error', 'Could not read image file.', 'red');
      }

function doGet(e) {

function doPost(e) {
  var body = JSON.parse(e.postData.contents || '{}');
  var action = body.action || '';
  var payload = body.payload || {};
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  if (action === 'updateStatus' && payload.Order_ID) {
    updateRowById(ss, ['Orders', 'Order', 'Sheet1'], ['Order_ID', 'ID'], payload.Order_ID, { Status: payload.Status });
  } else if (action === 'updateOrder' && payload.Order_ID) {
    updateRowById(ss, ['Orders', 'Order', 'Sheet1'], ['Order_ID', 'ID'], payload.Order_ID, payload);
  } else if (action === 'addOrder') {
    appendRowToSheet(ss, ['Orders', 'Order', 'Sheet1'], payload);
  } else if (action === 'updateProduct' && payload.Product_ID) {
    updateRowById(ss, ['Products', 'Product', 'Catalog'], ['Product_ID', 'ID'], payload.Product_ID, payload);
  } else if (action === 'addProduct') {
    appendRowToSheet(ss, ['Products', 'Product', 'Catalog'], payload);
  } else if (action === 'updateCollection' && payload.Category_ID) {
    updateRowById(ss, ['Collections', 'Categories', 'ShopCollections'], ['Category_ID', 'Collection_ID', 'ID'], payload.Category_ID, payload);
  } else if (action === 'addCollection') {
    appendRowToSheet(ss, ['Collections', 'Categories', 'ShopCollections'], payload);
  }

  return ContentService.createTextOutput(JSON.stringify({ ok: true, action: action }))
    .setMimeType(ContentService.MimeType.JSON);
}

function findTargetSheet(ss, names) {
  for (var i = 0; i < names.length; i++) {
    var sh = ss.getSheetByName(names[i]);
    if (sh) return sh;
  }
  return ss.getSheets()[0];
}

function getSheetRows(ss, names) {
  var sh = null;
  for (var i = 0; i < names.length; i++) {
    sh = ss.getSheetByName(names[i]);
    if (sh) break;
  }
  if (!sh) return [];
  var values = sh.getDataRange().getValues();
  if (values.length < 2) return [];
  var headers = values[0];
  var rows = [];
  for (var r = 1; r < values.length; r++) {
    var obj = {};
    for (var c = 0; c < headers.length; c++) {
      if (headers[c]) obj[String(headers[c]).trim()] = values[r][c];
    }
    rows.push(obj);
  }
  return rows;
}

function updateRowById(ss, sheetNames, idKeys, idVal, updates) {
  var sh = findTargetSheet(ss, sheetNames);
  var data = sh.getDataRange().getValues();
  if (data.length < 2) return;
  var headers = data[0].map(function(h) { return String(h).trim(); });
  var idCol = -1;
  for (var k = 0; k < idKeys.length; k++) {
    idCol = headers.indexOf(idKeys[k]);
    if (idCol !== -1) break;
  }
  if (idCol === -1) return;
  for (var r = 1; r < data.length; r++) {
    if (String(data[r][idCol]) === String(idVal)) {
      Object.keys(updates).forEach(function(key) {
        var col = headers.indexOf(key);
        if (col !== -1) sh.getRange(r + 1, col + 1).setValue(updates[key]);
      });
      break;
    }
  }
}

function appendRowToSheet(ss, sheetNames, obj) {
  var sh = findTargetSheet(ss, sheetNames);
  var headers = sh.getRange(1, 1, 1, Math.max(1, sh.getLastColumn())).getValues()[0];
  var row = headers.map(function(h) { return obj[String(h).trim()] !== undefined ? obj[String(h).trim()] : ''; });
  sh.appendRow(row);
}`;

    function renderSettingsPage() {
      const isSaved = Boolean(state.gasUrl && state.gasUrl.trim() !== '');

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <!-- Left: Permanent URL Lock Form & Live Fetch Log -->
          <div class="lg:col-span-6 space-y-5">
            <div class="bg-white rounded-2xl p-6 shadow-card border border-slate-200/80 space-y-5">
              <div class="flex items-start justify-between gap-3 pb-4 border-b border-slate-100">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-xl bg-brandBlue-50 text-brandBlue-700 flex items-center justify-center shrink-0">
                    ${Icons.sheet}
                  </div>
                  <div>
                    <h3 class="font-extrabold text-slate-900 text-base">Permanent Google Sheet Connection</h3>
                    <p class="text-xs text-slate-500">Save your Apps Script Web App URL once — it stays permanently locked and fetches live rows automatically.</p>
                  </div>
                </div>
                <span class="px-2.5 py-1 rounded-full text-[11px] font-bold shrink-0 ${isSaved ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                  ${isSaved ? 'Locked & Saved' : 'Not Connected'}
                </span>
              </div>

              <form onsubmit="saveAndFetchPermanentConfig(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Google Apps Script Web App URL</label>
                  <input id="cfg-gas-url" type="url" value="${state.gasUrl}"
                    placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                    class="w-full px-3.5 py-2.5 text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brandBlue-600 focus:bg-white outline-none" />
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Support Email (Printed on Invoices)</label>
                  <input id="cfg-support-email" type="email" value="${state.supportEmail}" required
                    class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brandBlue-600 focus:bg-white outline-none" />
                </div>

                <div class="pt-2 flex flex-wrap items-center justify-between gap-2.5 border-t border-slate-100">
                  ${isSaved ? `
                    <button type="button" onclick="removePermanentUrl()"
                      class="px-3.5 py-2.5 rounded-xl text-xs font-bold text-brandRed-600 bg-brandRed-50 hover:bg-brandRed-100 border border-brandRed-200 transition flex items-center gap-1.5">
                      ${Icons.trash} <span>Remove Saved URL</span>
                    </button>
                  ` : `<div></div>`}

                  <button type="submit"
                    class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brandBlue-700 to-brandBlue-800 hover:from-brandBlue-800 hover:to-brandBlue-900 shadow-sm transition flex items-center gap-1.5">
                    ${Icons.lock} <span>Save, Lock &amp; Fetch Data Now</span>
                  </button>
                </div>
              </form>
            </div>

            <!-- Live Connection Diagnostics Log -->
            <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-200/80 space-y-3">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-extrabold uppercase tracking-wider text-slate-700">Live Connection &amp; Fetch Log</h4>
                <button type="button" onclick="fetchFromGoogleSheet(false)" class="text-xs font-bold text-brandBlue-700 hover:underline">Test Fetch Now</button>
              </div>
              <div class="space-y-2 max-h-48 overflow-y-auto">
                ${state.syncLogs.map(log => `
                  <div class="p-2.5 rounded-xl text-xs border ${log.status === 'error' ? 'bg-brandRed-50 border-brandRed-200 text-brandRed-800' : log.status === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-700'} flex items-start justify-between gap-2">
                    <span class="font-medium leading-snug">${log.msg}</span>
                    <span class="text-[10px] opacity-75 shrink-0">${log.time}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Right: Copy-Paste Ready Google Apps Script Code -->
          <div class="lg:col-span-6 bg-white rounded-2xl p-6 shadow-card border border-slate-200/80 space-y-4">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h3 class="font-extrabold text-slate-900 text-base">Ready-to-Paste Google Apps Script</h3>
                <p class="text-xs text-slate-500">Paste this inside your Google Sheet (Extensions &rarr; Apps Script) &amp; Deploy as Web App (Anyone)</p>
              </div>
              <button type="button" onclick="copyAppsScriptCode()"
                class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white hover:bg-slate-800 transition flex items-center gap-1.5 shrink-0">
                ${Icons.copy} <span>Copy Code</span>
              </button>
            </div>

            <textarea id="apps-script-box" readonly rows="16"
              class="w-full p-3.5 text-[11px] font-mono bg-slate-950 text-emerald-300 rounded-xl border border-slate-800 leading-relaxed focus:outline-none">${APPS_SCRIPT_TEMPLATE}</textarea>
          </div>
        </div>
      `;
    }

    async function saveAndFetchPermanentConfig(e) {
      e.preventDefault();
      const url = document.getElementById('cfg-gas-url').value.trim();
      const email = document.getElementById('cfg-support-email').value.trim();

      state.gasUrl = url;
      state.supportEmail = email;

      if (url) {
        localStorage.setItem(STORAGE_KEY_GAS_URL, url);
      } else {
        localStorage.removeItem(STORAGE_KEY_GAS_URL);
      }
      localStorage.setItem(STORAGE_KEY_STORE_EMAIL, email);

      renderAll();
      if (url) {
        await fetchFromGoogleSheet(false);
      } else {
        showToast('Support Email Saved', email);
      }
    }

    function removePermanentUrl() {
      state.gasUrl = '';
      localStorage.removeItem(STORAGE_KEY_GAS_URL);
      appendSyncLog('info', 'Saved Apps Script URL removed.');
      renderAll();
      showToast('Sheet URL Removed', 'Connection cleared from permanent storage.', 'red');
    }

    function copyAppsScriptCode() {
      const box = document.getElementById('apps-script-box');
      if (!box) return;
      box.select();
      box.setSelectionRange(0, 99999);
      document.execCommand('copy');
      showToast('Apps Script Copied', 'Paste it into Extensions > Apps Script in your Google Sheet.');
    }
  </script>
</body>
</html>
