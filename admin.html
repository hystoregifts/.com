<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HY STORE | Complete ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1526;--gold:#ffc83b;--bg:#f4f6fa;--ink:#172033;--muted:#758096;--line:#e6eaf0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#08111f,#142844);display:grid;place-items:center;z-index:50;padding:20px}
.login-card{background:white;width:min(420px,100%);padding:30px;border-radius:20px;box-shadow:0 25px 80px #0005}
.logo{font-size:23px;font-weight:800;color:var(--navy)}.logo span{color:#c18a00}
.field{width:100%;border:1px solid var(--line);padding:12px 13px;border-radius:10px;outline:none;background:white}.field:focus{border-color:#d9a300;box-shadow:0 0 0 3px #ffc83b33}
.btn{padding:10px 14px;border-radius:10px;font-weight:700;background:var(--navy);color:white}.btn.gold{background:var(--gold);color:#171717}.btn.light{background:#eef1f6;color:#253047}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 10px;font-size:12px}
.shell{display:none;min-height:100vh}.sidebar{width:260px;background:var(--navy);color:white;position:fixed;inset:0 auto 0 0;overflow:auto;padding:22px 14px;z-index:10}
.brand{padding:4px 10px 22px;border-bottom:1px solid #ffffff20;margin-bottom:15px}.brand .logo{color:white}.brand small{color:#b7c1d1}
.nav-title{font-size:10px;letter-spacing:1.5px;color:#91a0b8;padding:12px 10px 7px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;background:transparent;color:#d7dfec;text-align:left;margin:2px 0;font-size:13px}
.nav:hover,.nav.active{background:#243650;color:var(--gold)}.nav .count{margin-left:auto;color:#9daec5;font-size:11px}
.main{margin-left:260px;min-height:100vh}.top{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0}.top-actions{display:flex;gap:9px;align-items:center}.content{padding:24px;max-width:1600px;margin:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar .field{max-width:360px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-bottom:20px}
.stat,.panel,.record{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 12px #1b2c4410}
.stat{padding:17px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:25px;margin-top:7px}
.panel{padding:18px;margin-bottom:18px}.panel h2{font-size:15px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.record{padding:15px;min-width:0}.record-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.record-title{font-weight:800;font-size:14px;overflow-wrap:anywhere}.record-sub{font-size:11px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.record-media{width:100%;height:145px;object-fit:cover;border-radius:10px;background:#f1f3f6;margin:12px 0}.record-data{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0;max-height:420px;overflow:auto;padding-right:3px}.datum{background:#f7f8fb;border-radius:8px;padding:8px;min-width:0}.datum small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.datum span{display:block;font-size:11px;font-weight:600;overflow-wrap:anywhere;margin-top:3px}
.actions{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px;margin-top:11px}
.empty{padding:45px 15px;text-align:center;color:var(--muted);background:white;border:1px dashed #cbd2df;border-radius:14px}
.modal{display:none;position:fixed;inset:0;background:#08111f99;z-index:30;overflow:auto;padding:22px}.modal.show{display:block}.modal-card{background:white;border-radius:17px;width:min(850px,100%);margin:25px auto;padding:22px;box-shadow:0 20px 80px #0004}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{font-size:18px;margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-item label{display:block;font-size:11px;font-weight:700;color:#5d687c;margin:0 0 6px}.form-item.full{grid-column:1/-1}.form-item textarea{min-height:90px;resize:vertical}
.image-preview{max-width:100%;max-height:120px;display:block;margin-top:8px;border-radius:8px}
.toast{position:fixed;bottom:20px;right:20px;background:#101b2e;color:white;padding:12px 16px;border-radius:10px;z-index:100;display:none;max-width:min(420px,90vw);font-size:13px}
.hidden{display:none!important}.muted{color:var(--muted);font-size:12px}
@media(max-width:850px){.sidebar{width:75px;padding:15px 8px}.brand .logo{font-size:0}.brand .logo:after{content:'HY';font-size:19px}.brand small,.nav span:not(.count),.nav-title{display:none}.nav{justify-content:center;font-size:17px}.nav .count{display:none}.main{margin-left:75px}.content{padding:15px}.top{padding:0 14px}}
@media(max-width:560px){.top{height:auto;min-height:65px;gap:8px}.top h1{font-size:15px}.top-actions .btn{padding:8px;font-size:11px}.form-grid{grid-template-columns:1fr}.form-item.full{grid-column:auto}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card">
 <div class="logo">HY STORE <span>ERP</span></div><p class="muted">Complete Google Sheets Management</p>
 <label class="muted">Username</label><input id="user" class="field" autocomplete="username" value="admin">
 <label class="muted" style="display:block;margin-top:12px">Password</label><input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Enter ERP password">
 <button class="btn gold" style="width:100%;margin-top:17px" onclick="login()">Login to ERP</button><p id="loginErr" style="color:#b91c1c;font-size:12px"></p>
</div></div>
<div id="shell" class="shell">
<aside class="sidebar"><div class="brand"><div class="logo">HY STORE <span>ERP</span></div><small>Complete Business Manager</small></div>
<div class="nav-title">Workspace</div><button class="nav active" id="nav-dashboard" onclick="showDashboard()">▦ <span>Dashboard</span></button>
<div class="nav-title">Google Sheets Pages</div><div id="sheetNav"></div>
<div class="nav-title">Tools</div><button class="nav" onclick="syncAll()">⟳ <span>Refresh all data</span></button>
</aside>
<main class="main"><header class="top"><h1 id="pageTitle">Dashboard</h1><div class="top-actions"><span id="syncLabel" class="muted">Not synced</span><button class="btn light" onclick="syncAll()">⟳ Sync</button><button class="btn gold" onclick="logout()">Logout</button></div></header>
<div class="content"><section id="dashboard"></section><section id="sheetPage" class="hidden"></section></div></main>
</div>
<div id="editModal" class="modal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Edit record</h2><button class="btn light small" onclick="closeModal()">✕ Close</button></div><div id="formFields" class="form-grid"></div><div style="display:flex;justify-content:flex-end;gap:9px;margin-top:20px"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="saveRecord()">Save to Google Sheets</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxDmDvjqGJRUWoLrWlY6M0T7XTW9N3nfSdEnE2Dycm8B7Jg_qdLjtj0YR0ca2Ghjs2a/exec';
const ERP_USER='admin', ERP_PASS='HYStore@2026';
let allSheets=[], currentSheet='', editingRow=0, editingMode='update', currentRecord={};
const icons={'Orders':'🛒','Products':'🎁','Payments':'💳','Invoices':'🧾','Expenses':'💸','Inventory':'📦','Customers':'👥','Catalog':'🗂️','Reviews':'⭐','SiteContent':'🖼️','Users':'🔐','Collections':'🧺','ERPSettings':'⚙️','ERPBackup':'🗄️'};
function login(){if(document.getElementById('user').value.trim()!==ERP_USER||document.getElementById('pass').value!==ERP_PASS){document.getElementById('loginErr').textContent='Username ya password ghalat hai.';return}document.getElementById('login').style.display='none';document.getElementById('shell').style.display='block';syncAll()}
function logout(){document.getElementById('shell').style.display='none';document.getElementById('login').style.display='grid';document.getElementById('pass').value=''}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login').style.display!=='none')login()});
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function apiGet(action){let r=await fetch(API+'?action='+encodeURIComponent(action));let j=await r.json();if(j.status!=='success')throw Error(j.message||'Google Sheets read failed');return j}
async function apiPost(payload){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});let j=await r.json();if(j.status!=='success')throw Error(j.message||'Save failed');return j}
async function syncAll(){try{document.getElementById('syncLabel').textContent='Syncing…';let d=await apiGet('erpGetAllSheets');allSheets=d.sheets||[];renderNav();document.getElementById('syncLabel').textContent='Synced '+new Date().toLocaleTimeString();if(currentSheet)openSheet(currentSheet);else showDashboard();toast('Google Sheets ka complete data load ho gaya.')}catch(e){document.getElementById('syncLabel').textContent='Sync failed';toast('Google Sheets connection error: '+e.message+' | URL/deployment aur access check karein.')}}
function renderNav(){let el=document.getElementById('sheetNav');el.innerHTML=allSheets.map(s=>`<button class="nav" id="nav-${escId(s.name)}" onclick="openSheet('${jsq(s.name)}')">${icons[s.name]||'▤'} <span>${esc(s.name)}</span><b class="count">${s.total}</b></button>`).join('')}
function showDashboard(){currentSheet='';document.getElementById('dashboard').classList.remove('hidden');document.getElementById('sheetPage').classList.add('hidden');document.getElementById('pageTitle').textContent='Dashboard';document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));document.getElementById('nav-dashboard').classList.add('active');let total=allSheets.reduce((n,s)=>n+s.total,0);document.getElementById('dashboard').innerHTML=`<div class="stats"><div class="stat"><small>GOOGLE SHEET TABS</small><strong>${allSheets.length}</strong></div><div class="stat"><small>TOTAL DATA RECORDS</small><strong>${total.toLocaleString()}</strong></div>${allSheets.filter(s=>['Orders','Products','Customers','Payments'].includes(s.name)).map(s=>`<div class="stat"><small>${esc(s.name.toUpperCase())}</small><strong>${s.total.toLocaleString()}</strong></div>`).join('')}</div><div class="panel"><h2>All Google Sheets Pages</h2><div class="grid">${allSheets.map(s=>`<div class="record"><div class="record-head"><div><div class="record-title">${icons[s.name]||'▤'} ${esc(s.name)}</div><div class="record-sub">${s.headers.length} columns · ${s.total} records</div></div><button class="btn small gold" onclick="openSheet('${jsq(s.name)}')">Open Page</button></div><div class="record-sub" style="margin-top:12px">${s.headers.map(esc).join(' · ')}</div></div>`).join('')}</div></div>`}
function openSheet(name){currentSheet=name;let s=allSheets.find(x=>x.name===name);if(!s)return;document.getElementById('dashboard').classList.add('hidden');let p=document.getElementById('sheetPage');p.classList.remove('hidden');document.getElementById('pageTitle').textContent=name;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));let nav=document.getElementById('nav-'+escId(name));if(nav)nav.classList.add('active');renderSheet(s)}
function renderSheet(s){let p=document.getElementById('sheetPage');p.innerHTML=`<div class="toolbar"><input class="field" id="searchRows" placeholder="Search ${esc(s.name)}..." oninput="filterCards()"><button class="btn gold" onclick="newRecord()">＋ Add New</button><button class="btn light" onclick="syncAll()">⟳ Reload</button><span class="muted">${s.total} records · ${s.headers.length} columns</span></div><div id="recordGrid" class="grid"></div>`;drawCards(s.rows,s.headers)}
function drawCards(rows,headers){let g=document.getElementById('recordGrid');if(!rows.length){g.innerHTML='<div class="empty">Is sheet mein abhi koi data record nahi hai.</div>';return}g.innerHTML=rows.map((r,i)=>{let keys=headers.filter(k=>String(r[k]??'').trim()!=='');let title=String(r[headers[1]]??r[headers[0]]??'Record '+(i+1));let imageKey=headers.find(k=>/(^img$|image|photo|picture|thumbnail|media|video|screenshot|banner)/i.test(k));let img=imageKey?String(r[imageKey]||''):'';let details=keys.filter(k=>k!==headers[0]&&k!==headers[1]&&k!==imageKey);return `<article class="record"><div class="record-head"><div><div class="record-title">${esc(title)}</div><div class="record-sub">${esc(headers[0]||'Row')} : ${esc(r[headers[0]]??r._row)}</div></div><span class="muted">#${r._row}</span></div>${img&&/^https?:/i.test(img)?`<img class="record-media" src="${esc(img)}" onerror="this.style.display='none'">`:''}<div class="record-data">${details.map(k=>`<div class="datum"><small>${esc(k)}</small><span>${esc(String(r[k]??''))}</span></div>`).join('')}</div><div class="actions"><button class="btn light small" onclick="viewRecord(${r._row})">◉ View</button><button class="btn small" onclick="editRecord(${r._row})">✎ Edit</button><button class="btn danger small" onclick="deleteRecord(${r._row})">⌫ Delete</button></div></article>`}).join('')}
function filterCards(){let s=allSheets.find(x=>x.name===currentSheet),q=document.getElementById('searchRows').value.toLowerCase();drawCards(s.rows.filter(r=>s.headers.some(h=>String(r[h]??'').toLowerCase().includes(q))),s.headers)}
function newRecord(){editingMode='add';editingRow=0;currentRecord={};showForm('Add '+currentSheet+' record',allSheets.find(x=>x.name===currentSheet).headers,{})}
function editRecord(row){let s=allSheets.find(x=>x.name===currentSheet),r=s.rows.find(x=>x._row===row);editingMode='update';editingRow=row;currentRecord=r;showForm('Edit '+currentSheet+' record',s.headers,r)}
function viewRecord(row){let s=allSheets.find(x=>x.name===currentSheet),r=s.rows.find(x=>x._row===row);let html=s.headers.map(h=>`<div class="datum"><small>${esc(h)}</small><span>${esc(String(r[h]??''))}</span></div>`).join('');document.getElementById('modalTitle').textContent=currentSheet+' · View record';document.getElementById('formFields').innerHTML=html;document.getElementById('editModal').classList.add('show');document.querySelector('#editModal .modal-card > div:last-child').innerHTML='<button class="btn light" onclick="closeModal()">Close</button>'}
function showForm(title,headers,r){document.getElementById('modalTitle').textContent=title;document.querySelector('#editModal .modal-card > div:last-child').innerHTML='<button class="btn light" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="saveRecord()">Save to Google Sheets</button>';document.getElementById('formFields').innerHTML=headers.map((h,i)=>{let v=r[h]??'';let media=/(^img$|image|photo|picture|thumbnail|media|video|screenshot|banner)/i.test(h);let long=/(description|comment|notes|items|json|subtitle|content|address)/i.test(h);return `<div class="form-item ${long?'full':''}"><label>${esc(h)}</label>${media?`<input class="field" id="f-${i}" data-header="${attr(h)}" value="${attr(v)}" placeholder="Paste URL or upload from gallery"><input type="file" accept="image/*,video/*" class="field" style="margin-top:7px" onchange="uploadMedia(this,'f-${i}')"><small class="muted">Choose image/video from your device gallery</small>`:long?`<textarea class="field" id="f-${i}" data-header="${attr(h)}">${esc(String(v))}</textarea>`:`<input class="field" id="f-${i}" data-header="${attr(h)}" value="${attr(v)}">`}</div>`}).join('');document.getElementById('editModal').classList.add('show')}
async function uploadMedia(input,id){let f=input.files[0];if(!f)return;if(f.size>8*1024*1024){toast('File 8MB se chhoti select karein.');input.value='';return}try{toast('Media Google Drive par upload ho rahi hai…');let b=await new Promise((res,rej)=>{let rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(f)});let r=await apiPost({action:'erpUploadMedia',name:f.name,mimeType:f.type,base64:b});document.getElementById(id).value=r.url;toast('Upload complete. Save dabayen.')}catch(e){toast('Upload error: '+e.message)}}
async function saveRecord(){let values={};document.querySelectorAll('#formFields [data-header]').forEach(el=>values[el.dataset.header]=el.value);try{await apiPost({action:'erpSheetSave',sheetName:currentSheet,mode:editingMode,rowIndex:editingRow,values});closeModal();toast('Google Sheets mein save ho gaya.');await syncAll()}catch(e){toast('Save error: '+e.message)}}
async function deleteRecord(row){if(!confirm('Kya aap is record ko delete karna chahte hain? Yeh original Google Sheet se delete hoga.'))return;try{await apiPost({action:'erpSheetSave',sheetName:currentSheet,mode:'delete',rowIndex:row});toast('Record delete ho gaya.');await syncAll()}catch(e){toast('Delete error: '+e.message)}}
function closeModal(){document.getElementById('editModal').classList.remove('show')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
function jsq(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function escId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_')}
</script>
</body></html>
