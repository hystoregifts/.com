<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HY STORE | Enterprise ERP System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6.5.1 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        hyRed: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            500: '#ef4444',
                            600: '#E50914',
                            700: '#B80710',
                            800: '#991b1b',
                        },
                        hyNavy: {
                            800: '#1E3A8A',
                            900: '#172554',
                            950: '#0F172A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.7);
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
        }
        .view-section {
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#F4F6F9] text-slate-800 font-sans antialiased overflow-x-hidden min-h-screen">

    <!-- ========================================================= -->
    <!-- 1. LOGIN SCREEN GATE                                      -->
    <!-- ========================================================= -->
    <div id="login" class="fixed inset-0 z-50 bg-gradient-to-br from-[#0F172A] via-[#172554] to-[#1E3A8A] flex items-center justify-center p-4">
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl w-full max-w-md p-6 sm:p-8 border border-white/20">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-[#1E3A8A] to-[#E50914] text-white font-black text-2xl shadow-lg mb-3">
                    HY
                </div>
                <h1 class="text-2xl font-black text-[#0F172A] tracking-tight">HY STORE <span class="text-[#E50914]">ERP</span></h1>
                <p class="text-xs font-semibold text-slate-500 mt-1"><i class="fa-solid fa-shield-halved text-[#1E3A8A] mr-1"></i> Complete Google Sheets Management System</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="user" autocomplete="username" value="admin" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#E50914] focus:border-transparent transition" placeholder="Enter ERP username">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input id="pass" type="password" autocomplete="current-password" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#E50914] focus:border-transparent transition" placeholder="Enter ERP password">
                    </div>
                </div>

                <div id="loginErr" class="hidden p-3 rounded-xl bg-red-50 text-red-700 text-xs font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                    <span id="loginErrMsg">Invalid username or password.</span>
                </div>

                <button id="loginBtn" onclick="login()" class="w-full py-3 bg-gradient-to-r from-[#E50914] to-[#B80710] hover:from-[#B80710] hover:to-[#991b1b] text-white text-xs font-extrabold rounded-xl shadow-lg shadow-red-950/20 active:scale-[0.99] transition cursor-pointer flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>LOGIN TO ERP</span>
                </button>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-100 text-center text-[11px] font-medium text-slate-400 flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                HY Store ERP System v3.0 Powered by Google Sheets
            </div>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 2. MAIN ERP SHELL                                         -->
    <!-- ========================================================= -->
    <div id="shell" class="hidden flex h-screen overflow-hidden">

        <!-- Mobile Backdrop -->
        <div id="mobile-backdrop" onclick="toggleDrawerMenu()" class="fixed inset-0 bg-slate-950/60 z-30 hidden backdrop-blur-xs transition-opacity"></div>

        <!-- Floating Protruding Edge Handle -->
        <button id="edge-arrow-btn" onclick="toggleDrawerMenu()" aria-label="Toggle Menu"
            class="fixed top-[45%] left-0 z-50 flex items-center justify-center w-7 h-14 bg-gradient-to-b from-[#1E3A8A] to-[#0F172A] hover:from-[#E50914] hover:to-[#B80710] text-white rounded-r-2xl shadow-xl border-y border-r border-white/20 transition-all duration-300 cursor-pointer group">
            <i id="edge-arrow-icon" class="fa-solid fa-chevron-right text-xs group-hover:scale-110 transition-transform"></i>
        </button>

        <!-- LEFT SIDEBAR -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-gradient-to-b from-[#0F172A] via-[#172554] to-[#1E3A8A] text-white flex flex-col transition-transform duration-300 ease-in-out shadow-2xl border-r border-white/10 -translate-x-full shrink-0">
            
            <!-- Sidebar Header -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
                <div class="flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#E50914] shadow-sm shadow-red-500"></span>
                    <span class="text-xs font-black tracking-widest uppercase text-blue-200">HY STORE MENU</span>
                </div>
                <button onclick="toggleDrawerMenu()" class="flex items-center justify-center w-7 h-7 rounded-lg bg-white/10 hover:bg-[#E50914] text-white transition cursor-pointer" title="Close Menu">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Sidebar Navigation Links -->
            <nav class="flex-1 overflow-y-auto sidebar-scroll px-3 py-4 space-y-1">
                
                <button id="nav-dashboard" onclick="showDashboard()" class="nav-item active-nav w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-extrabold bg-[#E50914] text-white shadow-md shadow-red-950/40 transition cursor-pointer">
                    <div class="flex items-center gap-3 truncate">
                        <i class="fa-solid fa-wave-square w-5 text-center text-sm"></i>
                        <span class="sidebar-text truncate">Dashboard</span>
                    </div>
                </button>

                <!-- GOOGLE SHEETS PAGES SECTION HEADER -->
                <div class="pt-4 pb-1 px-3.5 flex items-center justify-between">
                    <span class="sidebar-text text-[10px] font-bold tracking-widest uppercase text-blue-300/70">GOOGLE SHEETS PAGES</span>
                    <i class="fa-solid fa-table text-[10px] text-blue-300/50"></i>
                </div>

                <div id="sheetNav" class="space-y-1">
                    <!-- Dynamic Google Sheet Pages Navigation Rendered Here -->
                </div>

                <!-- SYSTEM TOOLS SECTION -->
                <div class="pt-4 pb-1 px-3.5">
                    <span class="sidebar-text text-[10px] font-bold tracking-widest uppercase text-blue-300/70">SYSTEM TOOLS</span>
                </div>

                <button onclick="syncAll()" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-blue-100 hover:bg-white/10 transition cursor-pointer">
                    <i class="fa-solid fa-rotate w-5 text-center text-sm text-blue-300"></i>
                    <span class="sidebar-text truncate">Refresh All Data</span>
                </button>
            </nav>

            <!-- Sidebar Footer -->
            <div class="p-4 border-t border-white/10 text-xs text-blue-200 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span class="sidebar-text font-bold">HY STORE v3.0</span>
                </div>
                <span class="text-[10px] bg-white/10 px-2 py-0.5 rounded-md font-mono text-blue-300">Sheets Sync</span>
            </div>
        </aside>

        <!-- MAIN CONTENT WRAPPER -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- TOP HEADER BAR -->
            <header class="bg-white border-b border-slate-200 px-3.5 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between shrink-0 z-20 shadow-xs">
                <div class="flex items-center gap-2.5 sm:gap-4 min-w-0">
                    <button onclick="toggleDrawerMenu()" class="p-2 rounded-xl text-slate-700 hover:bg-slate-100 active:scale-95 transition cursor-pointer" title="Open Menu">
                        <i class="fa-solid fa-bars text-base sm:text-lg"></i>
                    </button>

                    <div class="flex items-center gap-2 cursor-pointer shrink-0" onclick="showDashboard()">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-[#1E3A8A] to-[#E50914] flex items-center justify-center text-white font-black text-xs sm:text-sm shadow-xs">
                            HY
                        </div>
                        <div class="hidden md:block">
                            <div class="text-xs font-black text-slate-900 leading-tight tracking-tight">HY STORE</div>
                            <div class="text-[10px] font-bold text-slate-500">OFFICIAL ERP</div>
                        </div>
                    </div>

                    <div class="h-5 w-px bg-slate-200"></div>
                    <h1 id="pageTitle" class="text-sm sm:text-lg font-black text-[#0F172A] truncate">Dashboard</h1>
                </div>

                <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                    <span id="syncLabel" class="hidden sm:inline-block text-[11px] font-semibold text-slate-500 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">Not synced</span>

                    <button id="syncBtnHeader" onclick="syncAll()" class="flex items-center gap-1.5 text-xs font-bold text-[#1D4ED8] bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-xl transition cursor-pointer border border-blue-200/60 disabled:opacity-60 disabled:cursor-not-allowed" title="Fetch live Google Sheet data">
                        <i class="fa-solid fa-rotate text-xs"></i>
                        <span class="hidden xs:inline">Sync Google Sheet</span>
                    </button>

                    <button onclick="logout()" class="bg-[#E50914] hover:bg-[#B80710] text-white text-xs font-bold px-3 sm:px-4 py-1.5 rounded-xl shadow-xs transition flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-right-from-bracket text-xs"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </header>

            <!-- SCROLLABLE VIEWPORT -->
            <main class="flex-1 overflow-y-auto p-3.5 sm:p-6 space-y-5 sm:space-y-6 pb-20 sm:pb-8">
                
                <!-- DASHBOARD VIEW -->
                <section id="dashboard" class="view-section"></section>

                <!-- GENERAL GOOGLE SHEET PAGE VIEW -->
                <section id="sheetPage" class="view-section hidden"></section>

            </main>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 3. ADD / EDIT / VIEW RECORD MODAL                         -->
    <!-- ========================================================= -->
    <div id="editModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/70 backdrop-blur-xs p-3 sm:p-6 flex items-center justify-center">
        <div class="bg-white rounded-2xl w-full max-w-3xl shadow-2xl border border-slate-200 overflow-hidden my-auto transform transition-all">
            <!-- Modal Header -->
            <div class="bg-gradient-to-r from-[#0F172A] via-[#172554] to-[#1E3A8A] text-white px-5 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-pen-to-square text-[#E50914] text-base"></i>
                    <h2 id="modalTitle" class="text-sm sm:text-base font-black truncate">Edit Record</h2>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-[#E50914] text-white flex items-center justify-center transition cursor-pointer">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Modal Content Form Grid -->
            <div class="p-5 sm:p-6 max-h-[75vh] overflow-y-auto">
                <div id="formFields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Dynamic Inputs Rendered Here -->
                </div>
            </div>

            <!-- Modal Footer Controls -->
            <div id="modalFooter" class="bg-slate-50 px-5 py-3.5 border-t border-slate-200 flex justify-end gap-2.5">
                <button class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-xl transition cursor-pointer" onclick="closeModal()">Cancel</button>
                <button id="modalSaveBtn" class="px-5 py-2 bg-[#E50914] hover:bg-[#B80710] text-white text-xs font-bold rounded-xl shadow-xs transition cursor-pointer flex items-center gap-1.5 disabled:opacity-60 disabled:cursor-not-allowed" onclick="saveRecord()">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Save to Google Sheets</span>
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 bg-[#0F172A] text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 text-xs font-bold hidden max-w-sm flex items-center gap-2.5 transition-all">
        <i id="toastIcon" class="fa-solid fa-circle-info text-[#E50914] text-sm"></i>
        <span id="toastMsg">Notification message</span>
    </div>

    <!-- ========================================================= -->
    <!-- 4. JAVASCRIPT ENGINE & GOOGLE SHEETS API                   -->
    <!-- ========================================================= -->
    <script>
        // Exact API URL & ERP Auth Credentials
        const API = 'https://script.google.com/macros/s/AKfycbxDmDvjqGJRUWoLrWlY6M0T7XTW9N3nfSdEnE2Dycm8B7Jg_qdLjtj0YR0ca2Ghjs2a/exec';
        const ERP_USER = 'admin';
        const ERP_PASS = 'HYStore@2026';

        // ERP State Variables
        let allSheets = [];
        let currentSheet = '';
        let editingRow = 0;
        let editingMode = 'update';
        let currentRecord = {};
        let isSidebarOpen = false;

        // Standardized Order Status & Payment Status Dropdown Options
        const ORDER_STATUS_OPTIONS = ['Placed', 'Crafting', 'Packaged', 'Dispatched'];
        const PAYMENT_STATUS_OPTIONS = ['Verified', 'Pending'];

        // Helper: Convert Google Drive URLs to reliable viewable image/video links
        function formatMediaUrl(url) {
            if (!url) return '';
            let str = String(url).trim();
            let driveMatch = str.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)|drive\.google\.com\/thumbnail\?id=)([a-zA-Z0-9_-]+)/i);
            if (driveMatch && driveMatch[1]) {
                return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w1000`;
            }
            return str;
        }

        // Helper: Check if link is a Video
        function isVideoUrl(url) {
            if (!url) return false;
            let str = String(url).toLowerCase();
            if (/\.(mp4|webm|ogg|mov|m4v)(\?.*)?$/i.test(str)) return true;
            if (str.includes('drive.google.com') && (str.includes('video') || str.includes('preview'))) return true;
            return false;
        }

        // FontAwesome Icons Map for Google Sheet Tabs
        const icons = {
            'Dashboard': 'fa-solid fa-wave-square',
            'Orders': 'fa-solid fa-cart-shopping',
            'Products': 'fa-solid fa-gift',
            'Payments': 'fa-solid fa-credit-card',
            'Invoices': 'fa-solid fa-file-invoice-dollar',
            'Expenses': 'fa-solid fa-money-bill-trend-up',
            'Inventory': 'fa-solid fa-warehouse',
            'Customers': 'fa-solid fa-users',
            'Catalog': 'fa-solid fa-folder-tree',
            'Reviews': 'fa-solid fa-star',
            'SiteContent': 'fa-solid fa-photo-film',
            'Users': 'fa-solid fa-user-shield',
            'Collections': 'fa-solid fa-boxes-stacked',
            'ERPSettings': 'fa-solid fa-gear',
            'ERPBackup': 'fa-solid fa-database'
        };

        // Screen Initialization
        window.onload = function() {
            document.getElementById('user').focus();
        };

        // Authentication Handler with Loading State
        async function login() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value;
            const errBox = document.getElementById('loginErr');
            const loginBtn = document.getElementById('loginBtn');

            if (u !== ERP_USER || p !== ERP_PASS) {
                errBox.classList.remove('hidden');
                document.getElementById('loginErrMsg').textContent = 'Invalid username or password.';
                return;
            }

            errBox.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>SIGNING IN...</span>`;

            try {
                document.getElementById('login').style.display = 'none';
                document.getElementById('shell').classList.remove('hidden');
                await syncAll();
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> <span>LOGIN TO ERP</span>`;
            }
        }

        function logout() {
            document.getElementById('shell').classList.add('hidden');
            document.getElementById('login').style.display = 'flex';
            document.getElementById('pass').value = '';
            toast('Logged out successfully.', 'info');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
                login();
            }
        });

        // Toast Handler
        function toast(msg, type = 'info') {
            const t = document.getElementById('toast');
            const tm = document.getElementById('toastMsg');
            const ti = document.getElementById('toastIcon');
            tm.textContent = msg;

            if (type === 'error') {
                ti.className = 'fa-solid fa-circle-exclamation text-red-500 text-sm';
            } else if (type === 'success') {
                ti.className = 'fa-solid fa-circle-check text-emerald-400 text-sm';
            } else {
                ti.className = 'fa-solid fa-circle-info text-[#E50914] text-sm';
            }

            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        // Sidebar & Edge Handle Toggle
        function toggleDrawerMenu() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('mobile-backdrop');
            const edgeBtn = document.getElementById('edge-arrow-btn');
            const edgeIcon = document.getElementById('edge-arrow-icon');

            isSidebarOpen = !isSidebarOpen;

            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                backdrop.classList.remove('hidden');
                edgeBtn.style.left = '16rem';
                edgeIcon.classList.replace('fa-chevron-right', 'fa-chevron-left');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('translate-x-0');
                backdrop.classList.add('hidden');
                edgeBtn.style.left = '0px';
                edgeIcon.classList.replace('fa-chevron-left', 'fa-chevron-right');
            }
        }

        // Exact API Backend Wrappers
        async function apiGet(action) {
            let r = await fetch(API + '?action=' + encodeURIComponent(action));
            let j = await r.json();
            if (j.status !== 'success') throw Error(j.message || 'Google Sheets read failed');
            return j;
        }

        async function apiPost(payload) {
            let r = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            let j = await r.json();
            if (j.status !== 'success') throw Error(j.message || 'Save failed');
            return j;
        }

        // Sync Google Sheets Data with Loading Spinners
        async function syncAll() {
            const headerBtn = document.getElementById('syncBtnHeader');
            if (headerBtn) {
                headerBtn.disabled = true;
                headerBtn.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-xs"></i><span class="hidden xs:inline">Syncing...</span>`;
            }

            try {
                document.getElementById('syncLabel').textContent = 'Syncing…';
                let d = await apiGet('erpGetAllSheets');
                allSheets = d.sheets || [];
                renderNav();
                document.getElementById('syncLabel').textContent = 'Synced ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if (currentSheet) {
                    openSheet(currentSheet);
                } else {
                    showDashboard();
                }
                toast('All Google Sheets data synced successfully.', 'success');
            } catch (e) {
                document.getElementById('syncLabel').textContent = 'Sync failed';
                toast('Google Sheets connection error: ' + e.message, 'error');
            } finally {
                if (headerBtn) {
                    headerBtn.disabled = false;
                    headerBtn.innerHTML = `<i class="fa-solid fa-rotate text-xs"></i><span class="hidden xs:inline">Sync Google Sheet</span>`;
                }
            }
        }

        // Render Left Navigation Bar
        function renderNav() {
            let el = document.getElementById('sheetNav');
            el.innerHTML = allSheets.map(s => {
                const iconClass = icons[s.name] || 'fa-solid fa-table-list';
                const isActive = currentSheet === s.name;
                return `
                <button id="nav-${escId(s.name)}" onclick="openSheet('${jsq(s.name)}')" 
                    class="nav-item w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer ${isActive ? 'bg-[#E50914] text-white shadow-md' : 'text-blue-100 hover:bg-white/10'}">
                    <div class="flex items-center gap-3 truncate">
                        <i class="${iconClass} w-5 text-center text-sm ${isActive ? 'text-white' : 'text-blue-300'}"></i>
                        <span class="sidebar-text truncate">${esc(s.name)}</span>
                    </div>
                    <span class="sidebar-text text-[10px] font-bold px-2 py-0.5 rounded-full ${isActive ? 'bg-white/20 text-white' : 'bg-white/10 text-blue-200'}">${s.total}</span>
                </button>`;
            }).join('');
        }

        // Render Dashboard Overview
        function showDashboard() {
            currentSheet = '';
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('sheetPage').classList.add('hidden');
            document.getElementById('pageTitle').textContent = 'Dashboard';
            
            renderNav();
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('bg-[#E50914]', 'text-white', 'shadow-md'));
            document.getElementById('nav-dashboard').classList.add('bg-[#E50914]', 'text-white', 'shadow-md');

            let totalRecords = allSheets.reduce((n, s) => n + s.total, 0);
            let ordersSheet = allSheets.find(s => s.name === 'Orders');
            let productsSheet = allSheets.find(s => s.name === 'Products');
            let customersSheet = allSheets.find(s => s.name === 'Customers');

        // Open a Specific Sheet Page
        function openSheet(name) {
            currentSheet = name;

            if (!s) return;

            document.getElementById('dashboard').classList.add('hidden');
            let p = document.getElementById('sheetPage');
            p.classList.remove('hidden');
            document.getElementById('pageTitle').textContent = name;

            renderNav();

        }

        // Quick Inline Status Update Direct to Google Sheets with Loading Feedback
        async function quickUpdateRowField(rowNumber, headerName, newValue, selectEl) {
            let s = allSheets.find(x => x.name === currentSheet);
            if (!s) return;
            let r = s.rows.find(x => x._row === rowNumber);
            if (!r) return;

            if (selectEl) selectEl.disabled = true;
            toast(`Updating ${headerName} to "${newValue}"...`, 'info');

            r[headerName] = newValue;

            try {
                await apiPost({
                    action: 'erpSheetSave',
                    sheetName: currentSheet,
                    mode: 'update',
                    rowIndex: rowNumber,
                    values: r
                });
                toast(`${headerName} updated to "${newValue}" in Google Sheets!`, 'success');
                renderSheet(s);
            } catch (e) {
                toast('Update failed: ' + e.message, 'error');
                await syncAll();
            } finally {
                if (selectEl) selectEl.disabled = false;
            }
        }

        // Draw Records (Specialized Logic for Products, SiteContent Video Links, and Orders)
        function drawCards(rows, headers) {
            let g = document.getElementById('recordGrid');

                g.innerHTML = `
                    <div class="col-span-full bg-white rounded-2xl p-12 text-center border border-dashed border-slate-300">

                    </div>`;

            const isOrderSheet = currentSheet.toLowerCase().includes('order');

            g.innerHTML = rows.map((r, i) => {
                let keys = headers.filter(k => String(r[k] ?? '').trim() !== '');
                let title = String(r[headers[1]] ?? r[headers[0]] ?? 'Record ' + (i + 1));
                let imageKey = headers.find(k => /(^img$|image|photo|picture|thumbnail|media|video|screenshot|banner|pic|url|link)/i.test(k));
                let rawMedia = imageKey ? String(r[imageKey] || '') : '';
                let formattedMedia = formatMediaUrl(rawMedia);
                let isVideo = isVideoUrl(rawMedia);

                let statusHeader = headers.find(h => /(order_status|^status$|orderstatus)/i.test(h)) || 'Status';
                let paymentHeader = headers.find(h => /(payment_status|paymentstatus|payment)/i.test(h)) || 'Payment Status';

                // =========================================================
                // SPECIALIZED CARD: ORDERS (Compact, Professional & Interactive)
                // =========================================================
                if (isOrderSheet) {
                    let customerName = r['Customer'] || r['Customer Name'] || r['Name'] || title;
                    let phoneNum = r['Phone'] || r['Mobile'] || r['Contact'] || r['WhatsApp'] || '';
                    let totalAmt = r['Total'] || r['Amount'] || r['Price'] || r['Total Amount'] || '';
                    let orderItems = r['Items'] || r['Order Items'] || r['Products'] || r['Details'] || '';
                    
                    let currentStatus = String(r[statusHeader] || r['Status'] || 'Placed');
                    let currentPayment = String(r[paymentHeader] || r['Payment Status'] || 'Pending');

                    let cleanPhone = String(phoneNum).replace(/[^0-9]/g, '');

                    return `
                    <article class="bg-white rounded-2xl border border-slate-200 border-t-[3px] border-t-[#E50914] p-4 shadow-2xs hover:shadow-md transition flex flex-col justify-between space-y-3">

                        <!-- Customer Details & Quick Contact Buttons -->

                                <span class="text-[10px] font-extrabold text-slate-600 uppercase"><i class="fa-solid fa-tag text-[#E50914] mr-1"></i> Order Total</span>

                            ${orderItems ? `
                            <div class="text-[11px] text-slate-500 font-medium line-clamp-2 bg-slate-50/80 p-2 rounded-lg border border-slate-100">
                                <span class="font-bold text-slate-600">Items:</span> ${esc(String(orderItems))}
                            </div>` : ''}

                            <!-- Interactive Live Dropdowns directly on Card -->
                            <div class="grid grid-cols-2 gap-2 pt-1">
                                <!-- Order Status Dropdown -->
                                <div>
                                    <label class="block text-[9px] font-extrabold uppercase text-slate-400 mb-0.5">Order Status</label>
                                    <select onchange="quickUpdateRowField(${r._row}, '${statusHeader}', this.value, this)" 
                                        class="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-extrabold text-slate-800 focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#E50914] cursor-pointer disabled:opacity-50">
                                        ${ORDER_STATUS_OPTIONS.map(opt => `<option value="${opt}" ${opt.toLowerCase() === currentStatus.toLowerCase() ? 'selected' : ''}>${opt}</option>`).join('')}
                                        ${!ORDER_STATUS_OPTIONS.some(opt => opt.toLowerCase() === currentStatus.toLowerCase()) && currentStatus ? `<option value="${esc(currentStatus)}" selected>${esc(currentStatus)}</option>` : ''}
                                    </select>
                                </div>

                                <!-- Payment Status Dropdown -->
                                <div>
                                    <label class="block text-[9px] font-extrabold uppercase text-slate-400 mb-0.5">Payment</label>
                                    <select onchange="quickUpdateRowField(${r._row}, '${paymentHeader}', this.value, this)" 
                                        class="w-full px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-extrabold text-slate-800 focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#1E3A8A] cursor-pointer disabled:opacity-50">
                                        ${PAYMENT_STATUS_OPTIONS.map(opt => `<option value="${opt}" ${opt.toLowerCase() === currentPayment.toLowerCase() ? 'selected' : ''}>${opt}</option>`).join('')}

                        <!-- Card Action Buttons -->
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-end gap-1.5">

                                <i class="fa-solid fa-pen-to-square"></i>
                                <span>Edit</span>

                            <button id="del-btn-${r._row}" onclick="deleteRecord(${r._row})" class="px-2.5 py-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-[#E50914] text-[11px] font-bold transition flex items-center gap-1 cursor-pointer">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </article>`;
                }

                // =========================================================
                // GENERAL CARDS & PRODUCTS & VIDEO CONTENT (Full Height & Playable Video Support)
                // =========================================================
                let details = keys.filter(k => k !== headers[0] && k !== headers[1] && k !== imageKey).slice(0, 6);
                let extraCount = keys.length - details.length - (imageKey ? 3 : 2);

                return `
                <article class="bg-white rounded-2xl border border-slate-200 p-4 shadow-2xs hover:shadow-md transition flex flex-col justify-between space-y-3">
                    <div>
                        <!-- Header -->
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <div class="min-w-0">

                        <!-- PRODUCT IMAGE OR VIDEO PLAYER (Full Height Contain - Never Cut off) -->
                        ${rawMedia && /^https?:/i.test(rawMedia) ? (

                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </article>`;

        // Live Search Filter
        function filterCards() {
            let s = allSheets.find(x => x.name === currentSheet);
            if (!s) return;
            let q = document.getElementById('searchRows').value.toLowerCase();
            drawCards(s.rows.filter(r => s.headers.some(h => String(r[h] ?? '').toLowerCase().includes(q))), s.headers);
        }

        // Form Trigger: New Record
        function newRecord() {
            editingMode = 'add';
            editingRow = 0;
            currentRecord = {};
            showForm('Add ' + currentSheet + ' Record', allSheets.find(x => x.name === currentSheet).headers, {});
        }

        // Form Trigger: Edit Record
        function editRecord(row) {
            let s = allSheets.find(x => x.name === currentSheet);
            let r = s.rows.find(x => x._row === row);
            editingMode = 'update';
            editingRow = row;
            currentRecord = r;
            showForm('Edit ' + currentSheet + ' Record (Row #' + row + ')', s.headers, r);
        }

        // Form Trigger: View Record Details
        function viewRecord(row) {
            let s = allSheets.find(x => x.name === currentSheet);
            let r = s.rows.find(x => x._row === row);

            let html = s.headers.map(h => {
                let v = String(r[h] ?? '');
                let formatted = formatMediaUrl(v);
                let isVid = isVideoUrl(v);
                let isMedia = /^https?:/i.test(v) && (isVid || /(jpg|jpeg|png|webp|gif|svg)/i.test(v));

                return `
                <div class="col-span-1 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider">${esc(h)}</label>
                    ${isMedia ? (
                        isVid ? `<video src="${esc(v)}" controls playsinline class="h-48 max-w-full rounded-lg mt-2 border border-slate-200 bg-black p-1"></video>`
                        : `<img src="${esc(formatted)}" class="h-48 max-w-full object-contain rounded-lg mt-2 border border-slate-200 bg-white p-1">`
                    ) : `<div class="text-xs font-bold text-slate-800 mt-1 break-words">${esc(v || '—')}</div>`}
                </div>`;
            }).join('');

            document.getElementById('modalTitle').textContent = currentSheet + ' · Complete Record View';
            document.getElementById('formFields').innerHTML = html;
            document.getElementById('modalFooter').innerHTML = `
                <button class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold rounded-xl transition cursor-pointer" onclick="closeModal()">Close</button>
                <button class="px-4 py-2 bg-[#E50914] text-white text-xs font-bold rounded-xl shadow-xs transition cursor-pointer" onclick="editRecord(${row})">
                    <i class="fa-solid fa-pen-to-square mr-1"></i> Edit This Record
                </button>`;
            document.getElementById('editModal').classList.remove('hidden');
        }

        // Build Edit / Add Input Form
        function showForm(title, headers, r) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalFooter').innerHTML = `
                <button class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold rounded-xl transition cursor-pointer" onclick="closeModal()">Cancel</button>
                <button id="modalSaveBtn" class="px-5 py-2 bg-[#E50914] hover:bg-[#B80710] text-white text-xs font-bold rounded-xl shadow-xs transition cursor-pointer flex items-center gap-1.5 disabled:opacity-60 disabled:cursor-not-allowed" onclick="saveRecord()">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Save to Google Sheets</span>
                </button>`;

            document.getElementById('formFields').innerHTML = headers.map((iHeader, i) => {
                let h = iHeader;
                let v = r[h] ?? '';
                let formatted = formatMediaUrl(v);
                let isVid = isVideoUrl(v);

                let isMediaHeader = /(^img$|image|photo|picture|thumbnail|media|video|screenshot|banner|pic|url|link)/i.test(h);
                let isOrderStatusHeader = /(order_status|^status$|orderstatus)/i.test(h);
                let isPaymentStatusHeader = /(payment_status|paymentstatus|payment)/i.test(h);
                let long = /(description|comment|notes|items|json|subtitle|content|address)/i.test(h);

                // 1. ORDER STATUS DROPDOWN (Placed, Crafting, Packaged, Dispatched)
                if (isOrderStatusHeader) {
                    let curVal = String(v || 'Placed');
                    return `
                    <div class="col-span-1 space-y-1">
                        <label class="block text-xs font-bold text-slate-700">${esc(h)} (Status Option)</label>
                        <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#E50914]" id="f-${i}" data-header="${attr(h)}">
                            ${ORDER_STATUS_OPTIONS.map(opt => `<option value="${opt}" ${opt.toLowerCase() === curVal.toLowerCase() ? 'selected' : ''}>${opt}</option>`).join('')}
                            ${!ORDER_STATUS_OPTIONS.some(opt => opt.toLowerCase() === curVal.toLowerCase()) && curVal ? `<option value="${esc(curVal)}" selected>${esc(curVal)}</option>` : ''}
                        </select>
                    </div>`;
                }

                // 2. PAYMENT STATUS DROPDOWN (Verified, Pending)
                if (isPaymentStatusHeader) {
                    let curVal = String(v || 'Pending');
                    return `
                    <div class="col-span-1 space-y-1">
                        <label class="block text-xs font-bold text-slate-700">${esc(h)} (Payment Option)</label>
                        <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]" id="f-${i}" data-header="${attr(h)}">
                            ${PAYMENT_STATUS_OPTIONS.map(opt => `<option value="${opt}" ${opt.toLowerCase() === curVal.toLowerCase() ? 'selected' : ''}>${opt}</option>`).join('')}
                            ${!PAYMENT_STATUS_OPTIONS.some(opt => opt.toLowerCase() === curVal.toLowerCase()) && curVal ? `<option value="${esc(curVal)}" selected>${esc(curVal)}</option>` : ''}
                        </select>
                    </div>`;
                }

                // 3. MEDIA & GALLERY UPLOAD FIELD WITH IMAGE & VIDEO PREVIEW
                if (isMediaHeader) {
                    return `
                    <div class="col-span-full space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <label class="block text-xs font-bold text-slate-700"><i class="fa-solid fa-[#E50914] fa-photo-film text-[#E50914] mr-1"></i> ${esc(h)} (Photo / Video Link)</label>
                        <input class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]" id="f-${i}" data-header="${attr(h)}" value="${attr(v)}" placeholder="Google Drive URL will appear here after upload">
                        
                        <div class="flex items-center gap-3 pt-1">
                            <label class="px-3.5 py-2 bg-[#1E3A8A] hover:bg-[#172554] text-white text-xs font-bold rounded-xl cursor-pointer transition flex items-center gap-2 shadow-2xs">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Choose Gallery Photo / Video</span>
                                <input type="file" accept="image/*,video/*" class="hidden" onchange="uploadMedia(this, 'f-${i}', 'prev-f-${i}')">
                            </label>
                            <span class="text-[11px] text-slate-400 font-semibold">Max 25MB file size</span>
                        </div>

                        <!-- Live Photo / Video Preview Box inside Modal -->
                        <div id="prev-f-${i}" class="mt-2">
                            ${v && /^https?:/i.test(v) ? (
                                isVid ? `<video src="${esc(v)}" controls playsinline class="h-44 max-w-full rounded-xl border border-slate-200 bg-black p-1"></video>`
                                : `<img src="${esc(formatted)}" class="h-44 max-w-full object-contain rounded-xl border border-slate-200 bg-white p-1" onerror="this.style.display='none'">`
                            ) : ''}
                        </div>
                    </div>`;
                }

                // 4. LONG TEXT AREA
                if (long) {
                    return `
                    <div class="col-span-full space-y-1">
                        <label class="block text-xs font-bold text-slate-700">${esc(h)}</label>
                        <textarea class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1E3A8A] min-h-[90px] resize-y" id="f-${i}" data-header="${attr(h)}">${esc(String(v))}</textarea>
                    </div>`;
                }

                // 5. STANDARD TEXT INPUT
                return `
                <div class="col-span-1 space-y-1">
                    <label class="block text-xs font-bold text-slate-700">${esc(h)}</label>
                    <input class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1E3A8A]" id="f-${i}" data-header="${attr(h)}" value="${attr(v)}">
                </div>`;
            }).join('');

            document.getElementById('editModal').classList.remove('hidden');
        }

        // Upload Gallery Photo or Video & Instantly Replace Old Link & Preview
        async function uploadMedia(input, inputId, previewId) {
            let f = input.files[0];
            if (!f) return;
            if (f.size > 25 * 1024 * 1024) {
                toast('Please select a file smaller than 25MB.', 'error');
                input.value = '';
                return;
            }

            const inputEl = document.getElementById(inputId);
            const prevEl = document.getElementById(previewId);

            // 1. Immediately clear old link and show loading spinner inside preview box
            inputEl.value = '';
            prevEl.innerHTML = `
                <div class="flex items-center gap-2 p-3 bg-blue-50 text-[#1D4ED8] rounded-xl border border-blue-200 text-xs font-bold">
                    <i class="fa-solid fa-spinner animate-spin text-base"></i>
                    <span>Uploading media to Google Drive... Please wait.</span>
                </div>`;

            try {
                toast('Uploading media to Google Drive...', 'info');
                let b = await new Promise((res, rej) => {
                    let rd = new FileReader();
                    rd.onload = () => res(String(rd.result).split(',')[1]);
                    rd.onerror = rej;
                    rd.readAsDataURL(f);
                });

                let r = await apiPost({ action: 'erpUploadMedia', name: f.name, mimeType: f.type, base64: b });

                // 2. Completely replace old link with new URL in the input field
                inputEl.value = r.url;

                // 3. Render new uploaded photo or video in preview box
                let formatted = formatMediaUrl(r.url);
                let isVid = isVideoUrl(r.url) || f.type.startsWith('video/');

                prevEl.innerHTML = `
                    <div class="space-y-1">
                        <div class="text-[10px] font-bold text-emerald-600 flex items-center gap-1">
                            <i class="fa-solid fa-circle-check"></i> Media uploaded to Google Drive. Click Save to update Google Sheets.
                        </div>
                        ${isVid ? `<video src="${esc(r.url)}" controls playsinline class="h-44 max-w-full rounded-xl border border-slate-200 bg-black p-1"></video>`
                        : `<img src="${esc(formatted)}" class="h-44 max-w-full object-contain rounded-xl border border-slate-200 bg-white p-1">`}
                    </div>`;

                toast('Media uploaded to Google Drive. Click Save to update Google Sheets.', 'success');
            } catch (e) {
                prevEl.innerHTML = `<div class="p-2 text-xs font-bold text-red-600 bg-red-50 rounded-lg">Upload error: ${esc(e.message)}</div>`;
                toast('Upload error: ' + e.message, 'error');
            }
        }

        // Save Record to Google Sheets with Disabled Spinner State
        async function saveRecord() {
            let values = {};
            document.querySelectorAll('#formFields [data-header]').forEach(el => {
                values[el.dataset.header] = el.value;
            });

            const btn = document.getElementById('modalSaveBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>Saving to Google Sheets...</span>`;
            }

            try {
                toast('Saving record to Google Sheets...', 'info');
                await apiPost({
                    action: 'erpSheetSave',
                    sheetName: currentSheet,
                    mode: editingMode,
                    rowIndex: editingRow,
                    values: values
                });
                closeModal();
                toast('Record saved to Google Sheets!', 'success');
                await syncAll();
            } catch (e) {
                toast('Save error: ' + e.message, 'error');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><span>Save to Google Sheets</span>`;
                }
            }
        }

        // Delete Record from Google Sheets with Loading Spinner
        async function deleteRecord(row) {
            if (!confirm('Are you sure you want to delete this record? This action will permanently delete it from Google Sheets.')) return;
            
            const btn = document.getElementById(`del-btn-${row}`);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i>`;
            }

            try {
                toast('Deleting record from Google Sheets...', 'info');
                await apiPost({
                    action: 'erpSheetSave',
                    sheetName: currentSheet,
                    mode: 'delete',
                    rowIndex: row
                });
                toast('Record deleted from Google Sheets.', 'success');
                await syncAll();
            } catch (e) {
                toast('Delete error: ' + e.message, 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-trash"></i>`;
                }
            }
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // Utility Escapers
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function attr(s) {
            return esc(s).replace(/`/g, '&#96;');
        }
        function jsq(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }
        function escId(s) {
            return String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
        }
    </script>
</body>
</html>
